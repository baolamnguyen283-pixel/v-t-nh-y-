 <!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Jump</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #18232b;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

/* ================= MENU ================= */

#menu {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            rgba(52, 160, 205, .82),
            rgba(77, 184, 110, .82)
        );

    color: white;
    text-align: center;
}

.title {
    font-size: 64px;
    font-weight: 900;
    margin-bottom: 5px;

    text-shadow:
        4px 4px 0 #31515c;
}

.subtitle {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 20px;
}

.section-title {
    margin: 12px 0 8px;
    font-size: 22px;
}

.animals,
.difficulties {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
}

.choice {
    width: 120px;
    min-height: 80px;

    border: 3px solid rgba(255,255,255,.8);
    border-radius: 18px;

    background: rgba(255,255,255,.2);

    color: white;
    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    transition: .15s;
}

.choice:hover {
    transform: translateY(-4px);
}

.choice.selected {
    background: #ffd447;
    color: #3b351d;
    border-color: white;

    box-shadow:
        0 5px 0 rgba(120,80,0,.35);
}

.animal-icon {
    display: block;
    font-size: 36px;
    margin-bottom: 3px;
}

.start-button {
    margin-top: 25px;

    border: 0;
    border-radius: 18px;

    padding: 16px 48px;

    background: #ffb52e;
    color: #3c2b0b;

    font-size: 24px;
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 6px 0 #b87808;

    transition: .1s;
}

.start-button:hover {
    transform: translateY(-2px);
}

.start-button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #b87808;
}

/* ================= SCORE ================= */

#score {
    position: fixed;
    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 5;

    color: white;

    font-size: 38px;
    font-weight: 900;

    text-shadow:
        3px 3px 0 #33464d;
}

#highScore {
    position: fixed;
    top: 62px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 5;

    color: white;

    font-size: 17px;
    font-weight: bold;

    text-shadow:
        2px 2px 0 #33464d;
}

/* ================= GAME OVER ================= */

#gameOver {
    position: fixed;
    inset: 0;

    z-index: 20;

    display: none;

    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.55);

    color: white;
    text-align: center;
}

#gameOver h1 {
    margin: 0;

    font-size: 64px;

    text-shadow:
        4px 4px 0 #333;
}

#gameOver p {
    font-size: 24px;
}

.retry-button {
    padding: 15px 42px;

    border: none;
    border-radius: 16px;

    background: #ffd447;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;
}

/* ================= MOBILE ================= */

@media(max-width: 600px) {

    .title {
        font-size: 45px;
    }

    .choice {
        width: 100px;
        min-height: 70px;
    }

    .animal-icon {
        font-size: 28px;
    }

    .start-button {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu">

    <div class="title">ANIMAL JUMP</div>

    <div class="subtitle">
        Chọn nhân vật và vượt qua những cây cột!
    </div>

    <div class="section-title">
        Chọn con vật
    </div>

    <div class="animals">

        <button
            class="choice animal-choice selected"
            data-animal="duck">

            <span class="animal-icon">🦆</span>
            Vịt

        </button>

        <button
            class="choice animal-choice"
            data-animal="cat">

            <span class="animal-icon">🐱</span>
            Mèo

        </button>

        <button
            class="choice animal-choice"
            data-animal="rabbit">

            <span class="animal-icon">🐰</span>
            Thỏ

        </button>

        <button
            class="choice animal-choice"
            data-animal="frog">

            <span class="animal-icon">🐸</span>
            Ếch

        </button>

    </div>


    <div class="section-title">
        Chọn độ khó
    </div>

    <div class="difficulties">

        <button
            class="choice difficulty-choice selected"
            data-mode="easy">

            🟢 DỄ

        </button>

        <button
            class="choice difficulty-choice"
            data-mode="normal">

            🟡 VỪA

        </button>

        <button
            class="choice difficulty-choice"
            data-mode="hard">

            🔴 KHÓ

        </button>

    </div>


    <button
        class="start-button"
        id="startButton">

        ▶ BẮT ĐẦU CHƠI

    </button>

</div>


<!-- ================= SCORE ================= -->

<div id="score">0</div>

<div id="highScore">
    Kỷ lục: 0
</div>


<!-- ================= GAME OVER ================= -->

<div id="gameOver">

    <h1>GAME OVER</h1>

    <p id="result">
        Bạn được 0 điểm
    </p>

    <button
        class="retry-button"
        id="retryButton">

        🔄 CHƠI LẠI

    </button>

</div>


<canvas id="game"></canvas>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   MENU
===================================================== */

const menu =
    document.getElementById("menu");

const gameOverScreen =
    document.getElementById("gameOver");

const startButton =
    document.getElementById("startButton");

const retryButton =
    document.getElementById("retryButton");

const scoreText =
    document.getElementById("score");

const highScoreText =
    document.getElementById("highScore");

const resultText =
    document.getElementById("result");


/* =====================================================
   SETTINGS
===================================================== */

let selectedAnimal = "duck";

let selectedMode = "easy";


const difficulty = {

    easy: {

        speed: 3,

        gap: 210,

        spawn: 2300

    },

    normal: {

        speed: 4,

        gap: 175,

        spawn: 1950

    },

    hard: {

        speed: 5.5,

        gap: 145,

        spawn: 1700

    }

};


/* =====================================================
   CHỌN CON VẬT
===================================================== */

document
.querySelectorAll(".animal-choice")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            document
            .querySelectorAll(".animal-choice")
            .forEach(b =>
                b.classList.remove("selected")
            );

            this.classList.add("selected");

            selectedAnimal =
                this.dataset.animal;

        }
    );

});


/* =====================================================
   CHỌN ĐỘ KHÓ
===================================================== */

document
.querySelectorAll(".difficulty-choice")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            document
            .querySelectorAll(".difficulty-choice")
            .forEach(b =>
                b.classList.remove("selected")
            );

            this.classList.add("selected");

            selectedMode =
                this.dataset.mode;

        }
    );

});


/* =====================================================
   GAME VARIABLES
===================================================== */

let playing = false;

let gameOver = false;

let score = 0;

let pipes = [];

let lastPipe = 0;


/* =====================================================
   HIGH SCORE
===================================================== */

let highScore =
    Number(
        localStorage.getItem(
            "animalJumpHighScore"
        )
    ) || 0;

highScoreText.textContent =
    "Kỷ lục: " + highScore;


/* =====================================================
   PLAYER
===================================================== */

const player = {

    x: 160,

    y: 300,

    width: 58,

    height: 48,

    velocity: 0

};


const gravity = 0.5;

const jumpPower = -9;


/* =====================================================
   START GAME
===================================================== */

startButton.addEventListener(
    "click",
    startGame
);


function startGame() {

    playing = true;

    gameOver = false;

    score = 0;

    pipes = [];

    lastPipe = 0;

    player.x = 160;

    player.y =
        canvas.height / 2;

    player.velocity = 0;

    scoreText.textContent =
        "0";

    menu.style.display =
        "none";

    gameOverScreen.style.display =
        "none";

    createPipe();

}


/* =====================================================
   JUMP
===================================================== */

function jump() {

    if (!playing ||
        gameOver) return;

    player.velocity =
        jumpPower;

}


/* SPACE
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (e.code === "Space") {

            e.preventDefault();

            jump();

        }

    }
);


/* CLICK
===================================================== */

canvas.addEventListener(
    "pointerdown",
    jump
);


/* =====================================================
   CREATE PIPE
===================================================== */

function createPipe() {

    const d =
        difficulty[selectedMode];

    const minTop = 80;

    const maxTop =
        canvas.height - 250;

    const top =
        minTop +
        Math.random() *
        (maxTop - minTop);

    pipes.push({

        x:
            canvas.width + 50,

        width:
            90,

        top:
            top,

        bottom:
            top + d.gap,

        passed:
            false

    });

}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function drawBackground() {

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    sky.addColorStop(
        0,
        "#65c8eb"
    );

    sky.addColorStop(
        1,
        "#d8f7ff"
    );

    ctx.fillStyle =
        sky;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* SUN */

    ctx.fillStyle =
        "#ffe27a";

    ctx.beginPath();

    ctx.arc(
        canvas.width - 100,
        90,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* CLOUDS */

    drawCloud(
        120,
        100,
        35
    );

    drawCloud(
        canvas.width * .55,
        150,
        30
    );

    drawCloud(
        canvas.width * .82,
        70,
        28
    );

}


/* =====================================================
   CLOUD
===================================================== */

function drawCloud(
    x,
    y,
    size
) {

    ctx.fillStyle =
        "rgba(255,255,255,.85)";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + size,
        y - size * .3,
        size * .8,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + size * 2,
        y,
        size,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =====================================================
   DRAW PIPES
===================================================== */

function drawPipe(pipe) {

    const x =
        pipe.x;

    const w =
        pipe.width;


    /* thân */

    ctx.fillStyle =
        "#258c3c";

    ctx.fillRect(
        x,
        0,
        w,
        pipe.top
    );


    ctx.fillRect(
        x,
        pipe.bottom,
        w,
        canvas.height -
        pipe.bottom
    );


    /* đầu cột */

    ctx.fillStyle =
        "#45b954";

    ctx.fillRect(
        x - 7,
        pipe.top - 25,
        w + 14,
        25
    );

    ctx.fillRect(
        x - 7,
        pipe.bottom,
        w + 14,
        25
    );


    /* highlight */

    ctx.fillStyle =
        "rgba(255,255,255,.15)";

    ctx.fillRect(
        x + 12,
        0,
        9,
        pipe.top
    );

    ctx.fillRect(
        x + 12,
        pipe.bottom,
        9,
        canvas.height -
        pipe.bottom
    );


    /* viền */

    ctx.strokeStyle =
        "#17662b";

    ctx.lineWidth =
        4;

    ctx.strokeRect(
        x,
        0,
        w,
        pipe.top
    );

    ctx.strokeRect(
        x,
        pipe.bottom,
        w,
        canvas.height -
        pipe.bottom
    );

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer() {

    const x =
        player.x;

    const y =
        player.y;


    if (selectedAnimal === "duck") {

        drawDuck(x, y);

    }

    else if (
        selectedAnimal === "cat"
    ) {

        drawCat(x, y);

    }

    else if (
        selectedAnimal === "rabbit"
    ) {

        drawRabbit(x, y);

    }

    else if (
        selectedAnimal === "frog"
    ) {

        drawFrog(x, y);

    }

}


/* =====================================================
   DUCK
===================================================== */

function drawDuck(x, y) {

    /* thân */

    ctx.fillStyle =
        "#ffd83d";

    ctx.beginPath();

    ctx.ellipse(
        x + 27,
        y + 28,
        27,
        19,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* cánh */

    ctx.fillStyle =
        "#efa91d";

    ctx.beginPath();

    ctx.ellipse(
        x + 19,
        y + 30,
        14,
        9,
        -.3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* đầu */

    ctx.fillStyle =
        "#ffe24d";

    ctx.beginPath();

    ctx.arc(
        x + 43,
        y + 14,
        19,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* mỏ */

    ctx.fillStyle =
        "#ed8124";

    ctx.beginPath();

    ctx.moveTo(
        x + 57,
        y + 13
    );

    ctx.lineTo(
        x + 77,
        y + 20
    );

    ctx.lineTo(
        x + 57,
        y + 27
    );

    ctx.closePath();

    ctx.fill();


    /* mắt */

    drawEye(
        x + 49,
        y + 8
    );

}


/* =====================================================
   CAT
===================================================== */

function drawCat(x, y) {

    ctx.fillStyle =
        "#f2a65a";


    /* tai */

    ctx.beginPath();

    ctx.moveTo(
        x + 8,
        y + 15
    );

    ctx.lineTo(
        x + 13,
        y - 5
    );

    ctx.lineTo(
        x + 25,
        y + 10
    );

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        x + 38,
        y + 10
    );

    ctx.lineTo(
        x + 50,
        y - 5
    );

    ctx.lineTo(
        x + 55,
        y + 18
    );

    ctx.fill();


    /* đầu */

    ctx.beginPath();

    ctx.arc(
        x + 31,
        y + 25,
        25,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* thân */

    ctx.beginPath();

    ctx.ellipse(
        x + 25,
        y + 44,
        25,
        15,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    drawEye(
        x + 23,
        y + 20
    );

    drawEye(
        x + 39,
        y + 20
    );

}


/* =====================================================
   RABBIT
===================================================== */

function drawRabbit(x, y) {

    ctx.fillStyle =
        "#f5f5f5";


    /* tai */

    ctx.beginPath();

    ctx.ellipse(
        x + 18,
        y + 2,
        9,
        28,
        -.15,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.ellipse(
        x + 42,
        y + 2,
        9,
        28,
        .15,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* đầu */

    ctx.beginPath();

    ctx.arc(
        x + 30,
        y + 28,
        24,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* thân */

    ctx.beginPath();

    ctx.ellipse(
        x + 25,
        y + 47,
        25,
        14,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    drawEye(
        x + 22,
        y + 23
    );

    drawEye(
        x + 38,
        y + 23
    );


    /* mũi */

    ctx.fillStyle =
        "#ef8aaa";

    ctx.beginPath();

    ctx.arc(
        x + 30,
        y + 31,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =====================================================
   FROG
===================================================== */

function drawFrog(x, y) {

    ctx.fillStyle =
        "#58bd45";


    /* đầu */

    ctx.beginPath();

    ctx.ellipse(
        x + 30,
        y + 28,
        29,
        22,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* mắt trái */

    ctx.beginPath();

    ctx.arc(
        x + 13,
        y + 12,
        11,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* mắt phải */

    ctx.beginPath();

    ctx.arc(
        x + 47,
        y + 12,
        11,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* con ngươi */

    drawEye(
        x + 13,
        y + 12
    );

    drawEye(
        x + 47,
        y + 12
    );


    /* miệng */

    ctx.strokeStyle =
        "#176c2b";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.arc(
        x + 30,
        y + 29,
        13,
        0,
        Math.PI
    );

    ctx.stroke();

}


/* =====================================================
   EYE
===================================================== */

function drawEye(x, y) {

    ctx.fillStyle =
        "white";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        6,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        x + 1,
        y,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =====================================================
   GROUND
===================================================== */

function drawGround() {

    const ground =
        canvas.height - 55;


    ctx.fillStyle =
        "#78c84a";

    ctx.fillRect(
        0,
        ground,
        canvas.width,
        55
    );


    /* cỏ */

    ctx.fillStyle =
        "#9bdd58";

    for (
        let x = 0;
        x < canvas.width;
        x += 20
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            ground
        );

        ctx.lineTo(
            x + 7,
            ground - 9
        );

        ctx.lineTo(
            x + 13,
            ground
        );

        ctx.fill();

    }


    /* đất */

    ctx.fillStyle =
        "#a87342";

    ctx.fillRect(
        0,
        canvas.height - 18,
        canvas.width,
        18
    );

}


/* =====================================================
   UPDATE
===================================================== */

function update() {

    if (!playing ||
        gameOver) return;


    const d =
        difficulty[selectedMode];


    /* trọng lực */

    player.velocity +=
        gravity;

    player.y +=
        player.velocity;


    /* cột */

    for (
        const pipe of pipes
    ) {

        pipe.x -=
            d.speed;


        const hitX =
            player.x +
            player.width >
            pipe.x &&
            player.x <
            pipe.x +
            pipe.width;


        const hitY =
            player.y <
            pipe.top ||

            player.y +
            player.height >
            pipe.bottom;


        if (
            hitX &&
            hitY
        ) {

            endGame();

        }


        /* điểm */

        if (
            !pipe.passed &&
            pipe.x +
            pipe.width <
            player.x
        ) {

            pipe.passed = true;

            score++;

            scoreText.textContent =
                score;

        }

    }


    pipes =
        pipes.filter(
            p =>
            p.x >
            -150
        );


    /* trần */

    if (
        player.y < 0
    ) {

        endGame();

    }


    /* đất */

    if (
        player.y +
        player.height >
        canvas.height - 55
    ) {

        endGame();

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame() {

    if (gameOver) return;

    gameOver = true;

    playing = false;


    if (
        score >
        highScore
    ) {

        highScore =
            score;

        localStorage.setItem(
            "animalJumpHighScore",
            highScore
        );

    }


    highScoreText.textContent =
        "Kỷ lục: " +
        highScore;


    resultText.innerHTML =
        `Điểm của bạn: <b>${score}</b><br>
         Kỷ lục: <b>${highScore}</b>`;


    gameOverScreen.style.display =
        "flex";

}


/* =====================================================
   RETRY
===================================================== */

retryButton.addEventListener(
    "click",
    function() {

        gameOverScreen.style.display =
            "none";

        menu.style.display =
            "flex";

    }
);


/* =====================================================
   DRAW
===================================================== */

function draw() {

    drawBackground();


    for (
        const pipe of pipes
    ) {

        drawPipe(pipe);

    }


    drawGround();


    if (playing) {

        drawPlayer();

    }

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time) {

    if (
        playing &&
        !gameOver
    ) {

        if (
            time - lastPipe >
            difficulty[selectedMode].spawn
        ) {

            createPipe();

            lastPipe =
                time;

        }

        update();

    }


    draw();

    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
