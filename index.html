 <!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Jump</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#87ceeb,#dff8ff);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#app{
  width:100%;
  max-width:500px;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

/* ================= MENU ================= */

.screen{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,.96);
  border-radius:25px;
  padding:25px;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
  text-align:center;
}

.hidden{
  display:none !important;
}

h1{
  font-size:42px;
  margin-bottom:5px;
}

.subtitle{
  color:#666;
  margin-bottom:20px;
}

label{
  display:block;
  text-align:left;
  font-weight:bold;
  margin:12px 0 6px;
}

input{
  width:100%;
  padding:13px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#4caf50;
}

.difficulties{
  display:flex;
  gap:8px;
}

.difficulty{
  flex:1;
  border:2px solid #ddd;
  background:white;
  padding:11px 5px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.difficulty.active{
  background:#4caf50;
  color:white;
  border-color:#4caf50;
}

.main-btn{
  width:100%;
  border:0;
  background:#4caf50;
  color:white;
  font-size:19px;
  font-weight:bold;
  padding:14px;
  border-radius:14px;
  cursor:pointer;
  margin-top:18px;
  box-shadow:0 5px 0 #388e3c;
}

.main-btn:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #388e3c;
}

/* ================= CHARACTER ================= */

.character-title{
  font-size:28px;
  margin-bottom:5px;
}

.character-info{
  color:#666;
  margin-bottom:15px;
}

.animal-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  max-height:390px;
  overflow-y:auto;
  padding:5px;
}

.animal{
  background:#f4f4f4;
  border:2px solid transparent;
  border-radius:13px;
  padding:8px 3px;
  cursor:pointer;
  transition:.15s;
}

.animal:hover{
  transform:scale(1.05);
}

.animal.selected{
  background:#e8f5e9;
  border-color:#4caf50;
}

.animal-emoji{
  font-size:30px;
  display:block;
}

.animal-name{
  font-size:10px;
  margin-top:3px;
  color:#444;
}

.selected-name{
  margin-top:12px;
  font-weight:bold;
  color:#4caf50;
  min-height:20px;
}

/* ================= GAME ================= */

#gameScreen{
  position:relative;
  width:100%;
  height:100vh;
  max-width:500px;
  display:flex;
  justify-content:center;
  align-items:center;
}

canvas{
  width:100%;
  height:auto;
  max-height:100vh;
  background:linear-gradient(#8ed6ff,#d9f5ff);
  display:block;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

#gameUI{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.scoreBox{
  background:rgba(0,0,0,.45);
  color:white;
  padding:8px 13px;
  border-radius:12px;
  font-weight:bold;
}

#musicBtn{
  pointer-events:auto;
  border:0;
  background:rgba(255,255,255,.85);
  border-radius:50%;
  width:42px;
  height:42px;
  cursor:pointer;
  font-size:20px;
}

/* ================= GAME OVER ================= */

#gameOver{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.4);
}

.game-over-box{
  width:85%;
  background:white;
  border-radius:22px;
  padding:25px;
  text-align:center;
}

.game-over-box h2{
  font-size:32px;
  margin-bottom:10px;
}

.result-animal{
  font-size:60px;
  margin:10px;
}

.result-score{
  font-size:22px;
  margin:8px;
}

.best{
  color:#ff9800;
  font-weight:bold;
}

/* ================= RESPONSIVE ================= */

@media(max-width:400px){
  .screen{
    padding:18px;
  }

  h1{
    font-size:35px;
  }

  .animal-grid{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- ================= MÀN HÌNH CHÍNH ================= -->

  <div id="menuScreen" class="screen">

    <h1>🐾 Animal Jump</h1>

    <div class="subtitle">
      Trò chơi nhảy qua cột!
    </div>

    <label>Tên người chơi</label>
    <input id="playerName" type="text" maxlength="15"
           placeholder="Nhập tên của bạn">

    <label>Độ khó</label>

    <div class="difficulties">

      <button class="difficulty active" data-level="easy">
        🟢 Dễ
      </button>

      <button class="difficulty" data-level="normal">
        🟡 Thường
      </button>

      <button class="difficulty" data-level="hard">
        🔴 Khó
      </button>

    </div>

    <button id="startButton" class="main-btn">
      ▶ BẮT ĐẦU
    </button>

  </div>


  <!-- ================= CHỌN NHÂN VẬT ================= -->

  <div id="characterScreen" class="screen hidden">

    <div class="character-title">
      🐾 Chọn nhân vật
    </div>

    <div class="character-info">
      Chọn con vật bạn muốn điều khiển
    </div>

    <div id="animalGrid" class="animal-grid"></div>

    <div id="selectedName" class="selected-name">
      Chưa chọn nhân vật
    </div>

    <button id="playButton" class="main-btn">
      🚀 CHƠI NGAY
    </button>

  </div>


  <!-- ================= GAME ================= -->

  <div id="gameScreen" class="hidden">

    <canvas id="gameCanvas" width="400" height="700"></canvas>

    <div id="gameUI">

      <div class="scoreBox">
        ⭐ <span id="score">0</span>
      </div>

      <button id="musicBtn">
        🔊
      </button>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver" class="hidden">

      <div class="game-over-box">

        <h2>💥 Game Over!</h2>

        <div id="resultAnimal" class="result-animal">
          🐤
        </div>

        <div id="resultText">
        </div>

        <div class="result-score">
          Điểm: <b id="finalScore">0</b>
        </div>

        <div class="best">
          🏆 Kỷ lục: <span id="bestScore">0</span>
        </div>

        <button id="retryButton" class="main-btn">
          🔄 CHƠI LẠI
        </button>

        <button id="characterAgainButton"
                class="main-btn"
                style="background:#2196f3;box-shadow:0 5px 0 #1976d2;">
          🐾 ĐỔI NHÂN VẬT
        </button>

        <button id="menuButton"
                class="main-btn"
                style="background:#777;box-shadow:0 5px 0 #555;">
          🏠 MENU
        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   DANH SÁCH NHÂN VẬT
===================================================== */

const animals = [

  ["duck","🐤","Vịt"],
  ["cat","🐱","Mèo"],
  ["dog","🐶","Chó"],
  ["rabbit","🐰","Thỏ"],
  ["frog","🐸","Ếch"],
  ["panda","🐼","Gấu trúc"],
  ["fox","🦊","Cáo"],
  ["bee","🐝","Ong"],
  ["penguin","🐧","Chim cánh cụt"],
  ["bear","🐻","Gấu"],

  ["koala","🐨","Koala"],
  ["tiger","🐯","Hổ"],
  ["lion","🦁","Sư tử"],
  ["cow","🐮","Bò"],
  ["pig","🐷","Heo"],
  ["mouse","🐭","Chuột"],
  ["hamster","🐹","Hamster"],
  ["monkey","🐵","Khỉ"],
  ["chicken","🐔","Gà"],
  ["chick","🐥","Gà con"],

  ["bird","🐦","Chim"],
  ["owl","🦉","Cú"],
  ["parrot","🦜","Vẹt"],
  ["swan","🦢","Thiên nga"],
  ["eagle","🦅","Đại bàng"],
  ["turkey","🦃","Gà tây"],
  ["horse","🐴","Ngựa"],
  ["unicorn","🦄","Kỳ lân"],
  ["llama","🦙","Lạc đà Alpaca"],
  ["camel","🐫","Lạc đà"],

  ["elephant","🐘","Voi"],
  ["giraffe","🦒","Hươu cao cổ"],
  ["zebra","🦓","Ngựa vằn"],
  ["deer","🦌","Hươu"],
  ["boar","🐗","Heo rừng"],
  ["goat","🐐","Dê"],
  ["sheep","🐑","Cừu"],
  ["wolf","🐺","Sói"],
  ["dragon","🐲","Rồng"],
  ["dinosaur","🦖","Khủng long"]

];


/* =====================================================
   TẠO DANH SÁCH NHÂN VẬT
===================================================== */

const animalGrid = document.getElementById("animalGrid");

let selectedAnimal = animals[0];

animals.forEach((animal,index)=>{

  const button = document.createElement("button");

  button.className = "animal";

  if(index === 0){
    button.classList.add("selected");
  }

  button.innerHTML = `
    <span class="animal-emoji">${animal[1]}</span>
    <span class="animal-name">${animal[2]}</span>
  `;

  button.addEventListener("click",()=>{

    document.querySelectorAll(".animal")
      .forEach(x=>x.classList.remove("selected"));

    button.classList.add("selected");

    selectedAnimal = animal;

    document.getElementById("selectedName").textContent =
      "Đã chọn: " + animal[1] + " " + animal[2];

  });

  animalGrid.appendChild(button);

});


/* =====================================================
   ĐỘ KHÓ
===================================================== */

let selectedDifficulty = "easy";

const difficultyButtons =
  document.querySelectorAll(".difficulty");

difficultyButtons.forEach(button=>{

  button.addEventListener("click",()=>{

    difficultyButtons.forEach(x=>
      x.classList.remove("active")
    );

    button.classList.add("active");

    selectedDifficulty =
      button.dataset.level;

  });

});


/* =====================================================
   CHUYỂN MÀN HÌNH
===================================================== */

const menuScreen =
  document.getElementById("menuScreen");

const characterScreen =
  document.getElementById("characterScreen");

const gameScreen =
  document.getElementById("gameScreen");

const gameOver =
  document.getElementById("gameOver");


document.getElementById("startButton")
.addEventListener("click",()=>{

  startMusic();

  menuScreen.classList.add("hidden");

  characterScreen.classList.remove("hidden");

});


document.getElementById("playButton")
.addEventListener("click",()=>{

  characterScreen.classList.add("hidden");

  gameScreen.classList.remove("hidden");

  startGame();

});


/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");


/* =====================================================
   GAME VARIABLES
===================================================== */

let playerName = "";

let score = 0;

let bestScore =
  Number(localStorage.getItem("animalJumpBest")) || 0;

let running = false;

let player = {};

let pipes = [];

let lastPipe = 0;

let animation;


/* =====================================================
   ĐỘ KHÓ
   KHOẢNG TRỐNG ĐÃ NHỎ HƠN
===================================================== */

const difficulty = {

  easy:{
    speed:3.5,
    gap:175,
    spawn:1900
  },

  normal:{
    speed:4.4,
    gap:155,
    spawn:1650
  },

  hard:{
    speed:5.3,
    gap:140,
    spawn:1450
  }

};


/* =====================================================
   ÂM NHẠC
===================================================== */

let audioContext = null;

let musicOn = true;

let musicTimer = null;

const notes = [
  261.63,
  329.63,
  392,
  329.63,
  293.66,
  349.23,
  440,
  392
];

let noteIndex = 0;


function startMusic(){

  if(!musicOn) return;

  if(!audioContext){

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioCtx) return;

    audioContext = new AudioCtx();

  }

  if(audioContext.state === "suspended"){
    audioContext.resume();
  }

  if(musicTimer) return;

  musicTimer = setInterval(()=>{

    if(!audioContext || !musicOn) return;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.frequency.value =
      notes[noteIndex];

    oscillator.type = "sine";

    gain.gain.setValueAtTime(
      0.035,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.35
    );

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.35
    );

    noteIndex++;

    if(noteIndex >= notes.length){
      noteIndex = 0;
    }

  },430);

}


/* =====================================================
   NÚT NHẠC
===================================================== */

document.getElementById("musicBtn")
.addEventListener("click",(e)=>{

  musicOn = !musicOn;

  e.target.textContent =
    musicOn ? "🔊" : "🔇";

  if(musicOn){

    startMusic();

  }else{

    clearInterval(musicTimer);

    musicTimer = null;

  }

});


/* =====================================================
   BẮT ĐẦU GAME
===================================================== */

function startGame(){

  playerName =
    document.getElementById("playerName")
      .value.trim();

  if(!playerName){
    playerName = "Người chơi";
  }

  score = 0;

  pipes = [];

  lastPipe = 0;

  running = true;

  gameOver.classList.add("hidden");

  document.getElementById("score")
    .textContent = "0";

  player = {

    x:85,

    y:canvas.height/2,

    velocity:0,

    gravity:0.42,

    jump:-7.5,

    size:42

  };

  startMusic();

  cancelAnimationFrame(animation);

  animation =
    requestAnimationFrame(gameLoop);

}


/* =====================================================
   NHẢY
===================================================== */

function jump(){

  if(!running) return;

  player.velocity =
    player.jump;

}


/* =====================================================
   BÀN PHÍM
===================================================== */

document.addEventListener("keydown",(e)=>{

  if(e.code === "Space"){

    e.preventDefault();

    jump();

  }

});


/* =====================================================
   CHẠM / CLICK
===================================================== */

canvas.addEventListener("mousedown",jump);

canvas.addEventListener(
  "touchstart",
  (e)=>{
    e.preventDefault();
    jump();
  },
  {passive:false}
);


/* =====================================================
   TẠO CỘT
===================================================== */

function createPipe(){

  const d =
    difficulty[selectedDifficulty];

  const minTop = 80;

  const maxTop =
    canvas.height -
    d.gap -
    130;

  const top =
    Math.random() *
    (maxTop - minTop) +
    minTop;

  pipes.push({

    x:canvas.width,

    width:62,

    top:top,

    gap:d.gap,

    passed:false

  });

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time){

  if(!running) return;

  const d =
    difficulty[selectedDifficulty];

  update(time,d);

  draw();

  animation =
    requestAnimationFrame(gameLoop);

}


/* =====================================================
   UPDATE
===================================================== */

function update(time,d){

  player.velocity +=
    player.gravity;

  player.y +=
    player.velocity;


  /* Tạo cột */

  if(
    !lastPipe ||
    time - lastPipe > d.spawn
  ){

    createPipe();

    lastPipe = time;

  }


  /* Di chuyển cột */

  pipes.forEach(pipe=>{

    pipe.x -= d.speed;

  });


  /* Xóa cột */

  pipes =
    pipes.filter(pipe =>
      pipe.x + pipe.width > -20
    );


  /* Điểm */

  pipes.forEach(pipe=>{

    if(
      !pipe.passed &&
      pipe.x + pipe.width < player.x
    ){

      pipe.passed = true;

      score++;

      document.getElementById("score")
        .textContent = score;

    }

  });


  /* Va chạm */

  if(
    player.y - player.size/2 <= 0 ||
    player.y + player.size/2 >= canvas.height - 55
  ){

    endGame();

    return;

  }


  for(const pipe of pipes){

    const playerLeft =
      player.x - player.size/2;

    const playerRight =
      player.x + player.size/2;

    const playerTop =
      player.y - player.size/2;

    const playerBottom =
      player.y + player.size/2;


    const pipeLeft =
      pipe.x;

    const pipeRight =
      pipe.x + pipe.width;


    const hitX =
      playerRight > pipeLeft &&
      playerLeft < pipeRight;


    const hitTop =
      playerTop < pipe.top;

    const hitBottom =
      playerBottom >
      pipe.top + pipe.gap;


    if(
      hitX &&
      (hitTop || hitBottom)
    ){

      endGame();

      return;

    }

  }

}


/* =====================================================
   VẼ GAME
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* BẦU TRỜI */

  const sky =
    ctx.createLinearGradient(
      0,0,
      0,canvas.height
    );

  sky.addColorStop(
    0,
    "#87d8ff"
  );

  sky.addColorStop(
    1,
    "#e8faff"
  );

  ctx.fillStyle = sky;

  ctx.fillRect(
    0,0,
    canvas.width,
    canvas.height
  );


  /* MÂY */

  drawCloud(70,90,1);

  drawCloud(270,150,.8);

  drawCloud(160,260,.6);


  /* CỘT */

  pipes.forEach(drawPipe);


  /* MẶT ĐẤT */

  ctx.fillStyle = "#78c850";

  ctx.fillRect(
    0,
    canvas.height-55,
    canvas.width,
    55
  );

  ctx.fillStyle = "#5fa63b";

  ctx.fillRect(
    0,
    canvas.height-55,
    canvas.width,
    8
  );


  /* NHÂN VẬT */

  drawPlayer();

}


/* =====================================================
   VẼ MÂY
===================================================== */

function drawCloud(x,y,s){

  ctx.save();

  ctx.translate(x,y);

  ctx.scale(s,s);

  ctx.fillStyle =
    "rgba(255,255,255,.8)";

  ctx.beginPath();

  ctx.arc(0,10,22,0,Math.PI*2);

  ctx.arc(25,5,28,0,Math.PI*2);

  ctx.arc(55,12,20,0,Math.PI*2);

  ctx.fill();

  ctx.restore();

}


/* =====================================================
   VẼ CỘT
===================================================== */

function drawPipe(pipe){

  const bottomStart =
    pipe.top + pipe.gap;


  /* Cột trên */

  const topGradient =
    ctx.createLinearGradient(
      pipe.x,
      0,
      pipe.x + pipe.width,
      0
    );

  topGradient.addColorStop(
    0,
    "#2e8b36"
  );

  topGradient.addColorStop(
    .5,
    "#63c75c"
  );

  topGradient.addColorStop(
    1,
    "#23752c"
  );

  ctx.fillStyle =
    topGradient;

  ctx.fillRect(
    pipe.x,
    0,
    pipe.width,
    pipe.top
  );


  /* Viền */

  ctx.strokeStyle =
    "#1c6425";

  ctx.lineWidth = 3;

  ctx.strokeRect(
    pipe.x,
    0,
    pipe.width,
    pipe.top
  );


  /* Đầu cột trên */

  ctx.fillStyle =
    "#55b94d";

  ctx.fillRect(
    pipe.x - 7,
    pipe.top - 22,
    pipe.width + 14,
    22
  );

  ctx.strokeRect(
    pipe.x - 7,
    pipe.top - 22,
    pipe.width + 14,
    22
  );


  /* Cột dưới */

  ctx.fillStyle =
    topGradient;

  ctx.fillRect(
    pipe.x,
    bottomStart,
    pipe.width,
    canvas.height - bottomStart
  );


  ctx.strokeRect(
    pipe.x,
    bottomStart,
    pipe.width,
    canvas.height - bottomStart
  );


  /* Đầu cột dưới */

  ctx.fillStyle =
    "#55b94d";

  ctx.fillRect(
    pipe.x - 7,
    bottomStart,
    pipe.width + 14,
    22
  );

  ctx.strokeRect(
    pipe.x - 7,
    bottomStart,
    pipe.width + 14,
    22
  );


  /* Ánh sáng */

  ctx.fillStyle =
    "rgba(255,255,255,.18)";

  ctx.fillRect(
    pipe.x + 9,
    0,
    7,
    pipe.top
  );

  ctx.fillRect(
    pipe.x + 9,
    bottomStart,
    7,
    canvas.height-bottomStart
  );

}


/* =====================================================
   VẼ NHÂN VẬT
===================================================== */

function drawPlayer(){

  ctx.save();

  ctx.font =
    player.size + "px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.shadowColor =
    "rgba(0,0,0,.2)";

  ctx.shadowBlur = 5;

  ctx.fillText(
    selectedAnimal[1],
    player.x,
    player.y
  );

  ctx.restore();

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

  if(!running) return;

  running = false;

  cancelAnimationFrame(animation);


  if(score > bestScore){

    bestScore = score;

    localStorage.setItem(
      "animalJumpBest",
      bestScore
    );

  }


  document.getElementById("finalScore")
    .textContent = score;

  document.getElementById("bestScore")
    .textContent = bestScore;

  document.getElementById("resultAnimal")
    .textContent = selectedAnimal[1];

  document.getElementById("resultText")
    .innerHTML =
      `<b>${playerName}</b> đã chơi với ${selectedAnimal[2]}`;


  gameOver.classList.remove("hidden");

}


/* =====================================================
   CHƠI LẠI
===================================================== */

document.getElementById("retryButton")
.addEventListener("click",()=>{

  gameOver.classList.add("hidden");
