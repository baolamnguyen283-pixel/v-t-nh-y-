 <!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Animal Jump 🐾</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#78d8ff,#d7f8ff);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.screen{
  width:100%;
  max-width:900px;
  min-height:100vh;
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.screen.active{
  display:flex;
}

.card{
  width:min(700px,95vw);
  background:rgba(255,255,255,.96);
  border-radius:25px;
  padding:28px;
  text-align:center;
  box-shadow:0 15px 45px rgba(0,0,0,.2);
}

h1{
  font-size:42px;
  color:#1684b8;
  margin-bottom:12px;
}

h2{
  color:#1684b8;
  margin-bottom:15px;
}

input{
  width:100%;
  max-width:450px;
  padding:14px;
  border:2px solid #9edff5;
  border-radius:14px;
  font-size:18px;
  margin:10px 0 15px;
  outline:none;
}

button{
  border:0;
  border-radius:14px;
  padding:12px 20px;
  margin:5px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  background:#20a9df;
  color:white;
  transition:.15s;
}

button:hover{
  transform:scale(1.05);
}

button:active{
  transform:scale(.96);
}

.difficulty{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.diff{
  background:#ddd;
  color:#333;
}

.diff.selected{
  background:#20a9df;
  color:white;
}

.musicBox{
  margin:15px auto;
  padding:14px;
  background:#eefaff;
  border-radius:18px;
  max-width:500px;
}

.musicButtons{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
}

.musicBtn{
  background:#ddd;
  color:#333;
}

.musicBtn.selected{
  background:#8b5cf6;
  color:white;
}

.animal-grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:7px;
  padding:8px;
  min-height:300px;
}

.animal{
  height:52px;
  font-size:29px;
  padding:3px;
  background:#eefaff;
  border:2px solid transparent;
  border-radius:12px;
}

.animal.selected{
  border-color:#1684b8;
  background:#bdeeff;
  transform:scale(1.07);
}

.pageInfo{
  font-size:18px;
  font-weight:bold;
  margin:8px;
  color:#555;
}

.pageButtons{
  display:flex;
  justify-content:center;
  align-items:center;
}

.pageButtons button{
  min-width:100px;
}

#gameScreen{
  padding:0;
  position:relative;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:900px;
  overflow:hidden;
  background:linear-gradient(#76d8ff 0%,#d5f7ff 75%,#71d35c 75%);
}

#score{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  font-size:28px;
  font-weight:bold;
  color:white;
  text-shadow:2px 2px 4px #555;
}

#player{
  position:absolute;
  width:55px;
  height:55px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:43px;
  z-index:10;
}

.pipe{
  position:absolute;
  width:65px;
  background:linear-gradient(90deg,#189447,#36cf65,#13793a);
  border:3px solid #0d692e;
  z-index:5;
}

.pipe.top{
  top:0;
  border-radius:0 0 10px 10px;
}

.pipe.bottom{
  bottom:25%;
  border-radius:10px 10px 0 0;
}

.pipe::after{
  content:"";
  position:absolute;
  left:-8px;
  width:78px;
  height:24px;
  background:linear-gradient(90deg,#16823d,#48dc70,#126b34);
  border:3px solid #0d692e;
  border-radius:6px;
}

.pipe.top::after{
  bottom:-3px;
}

.pipe.bottom::after{
  top:-3px;
}

.ground{
  position:absolute;
  bottom:0;
  height:25%;
  width:100%;
  background:
    repeating-linear-gradient(
      45deg,
      #65c94d 0,
      #65c94d 18px,
      #56b942 18px,
      #56b942 36px
    );
  border-top:5px solid #3b9c35;
  z-index:8;
}

#gameOver{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:50;
}

.over-card{
  background:white;
  padding:30px;
  width:min(400px,90vw);
  border-radius:25px;
  text-align:center;
}

.over-card h2{
  color:#e34a4a;
  font-size:32px;
}

#finalScore{
  font-size:24px;
  margin:10px;
}

@media(max-width:650px){

  h1{
    font-size:34px;
  }

  .card{
    padding:18px;
  }

  .animal-grid{
    grid-template-columns:repeat(5,1fr);
    gap:6px;
  }

  .animal{
    height:55px;
    font-size:30px;
  }

  #player{
    width:48px;
    height:48px;
    font-size:38px;
  }

  .pipe{
    width:55px;
  }

  .pipe::after{
    width:68px;
  }
}
</style>
</head>

<body>

<section id="menuScreen" class="screen active">

<div class="card">

<h1>🐾 Animal Jump</h1>

<p>Nhập tên người chơi</p>

<input id="playerName"
maxlength="20"
placeholder="Tên của bạn...">

<h3>Chọn độ khó</h3>

<div class="difficulty">

<button class="diff selected" data-level="easy">
🟢 Dễ
</button>

<button class="diff" data-level="normal">
🟡 Thường
</button>

<button class="diff" data-level="hard">
🔴 Khó
</button>

</div>

<div class="musicBox">

<h3>🎵 Nhạc nền</h3>

<div class="musicButtons">

<button class="musicBtn selected" data-music="1">
🎮 Gaming
</button>

<button class="musicBtn" data-music="2">
⚡ Phonk
</button>

<button class="musicBtn" data-music="3">
🌙 Chill
</button>

</div>

</div>

<button id="chooseAnimalBtn">
🐾 Chọn nhân vật
</button>

</div>

</section>


<section id="animalScreen" class="screen">

<div class="card">

<h2 id="pageTitle">
🐾 Trang 1 - Động vật
</h2>

<div id="animalGrid" class="animal-grid"></div>

<div class="pageInfo">
Trang <span id="pageNumber">1</span> / 2
</div>

<div class="pageButtons">

<button id="prevPage">
◀ Trước
</button>

<button id="nextPage">
Sau ▶
</button>

</div>

<br>

<button id="backBtn">
⬅ Quay lại
</button>

<button id="startBtn">
🚀 Bắt đầu
</button>

</div>

</section>


<section id="gameScreen" class="screen">

<div id="game">

<div id="score">0</div>

<div id="player">🐤</div>

<div class="ground"></div>

<div id="gameOver">

<div class="over-card">

<h2>💥 Game Over!</h2>

<div id="finalScore">
Điểm: 0
</div>

<div id="bestScore">
Kỷ lục: 0
</div>

<button id="retryBtn">
🔄 Chơi lại
</button>

<button id="menuBtn">
🏠 Menu
</button>

</div>

</div>

</div>

</section>


<script>

const animals = [

"🐶","🐱","🐭","🐹","🐰",
"🦊","🐻","🐼","🐨","🐯",
"🦁","🐮","🐷","🐸","🐵",
"🐔","🐧","🐦","🐤","🦆",
"🦅","🦉","🐺","🐗","🐴",
"🦄","🐝","🦋","🐢","🐍",
"🦎","🦖","🦕","🐙","🦀",
"🐠","🐟","🦈","🐳","🐬",
"🦓","🦒","🐘","🦏","🦛",
"🐪","🦙","🦘","🦬","🦌"

];

const icons = [

"😀","😎","😂","🤣","😍",
"🥰","😘","😜","🤪","🤩",
"🥳","😴","🤔","😱","😈",
"👻","💀","👽","🤖","🎃",
"🔥","💥","⭐","🌟","✨",
"⚡","💎","❤️","💙","💚",
"💜","🖤","🤍","💯","🎯",
"🎮","🎲","🎸","🎧","🏆",
"🚀","✈️","🏎️","⚽","🏀",
"🎁","🍕","🍔","🍩","🍉"

];

const menuScreen =
document.getElementById("menuScreen");

const animalScreen =
document.getElementById("animalScreen");

const gameScreen =
document.getElementById("gameScreen");

const animalGrid =
document.getElementById("animalGrid");

const pageTitle =
document.getElementById("pageTitle");

const pageNumber =
document.getElementById("pageNumber");

const player =
document.getElementById("player");

const game =
document.getElementById("game");

const scoreText =
document.getElementById("score");

const gameOver =
document.getElementById("gameOver");

const finalScore =
document.getElementById("finalScore");

const bestScore =
document.getElementById("bestScore");

const playerName =
document.getElementById("playerName");


/* KHE ĐÃ TO HƠN */

const settings = {

easy:{
speed:3.5,
gap:155,
spawn:1900
},

normal:{
speed:4.5,
gap:140,
spawn:1650
},

hard:{
speed:5.5,
gap:125,
spawn:1450
}

};


let difficulty = "easy";

let selectedAnimal = "🐤";

let currentPage = 1;

let selectedMusic = 1;

let running = false;

let score = 0;

let best =
Number(localStorage.getItem("animalJumpBest") || 0);

let playerY = 300;

let velocity = 0;

let pipes = [];

let lastTime = 0;

let spawnTimer = 0;

let animation;

let audioContext = null;

let musicTimer = null;


function showPage(page){

currentPage = page;

animalGrid.innerHTML = "";

let list =
page === 1 ? animals : icons;

pageTitle.textContent =
page === 1
? "🐾 Trang 1 - Động vật"
: "✨ Trang 2 - Icon";

pageNumber.textContent = page;

list.forEach(animal=>{

const button =
document.createElement("button");

button.className = "animal";

button.textContent = animal;

if(animal === selectedAnimal){
button.classList.add("selected");
}

button.onclick = ()=>{

document
.querySelectorAll(".animal")
.forEach(x =>
x.classList.remove("selected")
);

button.classList.add("selected");

selectedAnimal = animal;

};

animalGrid.appendChild(button);

});

}


showPage(1);


document.getElementById(
"prevPage"
).onclick = ()=>showPage(1);


document.getElementById(
"nextPage"
).onclick = ()=>showPage(2);


document
.querySelectorAll(".diff")
.forEach(button=>{

button.onclick = ()=>{

document
.querySelectorAll(".diff")
.forEach(x =>
x.classList.remove("selected")
);

button.classList.add("selected");

difficulty =
button.dataset.level;

};

});


document
.querySelectorAll(".musicBtn")
.forEach(button=>{

button.onclick = ()=>{

document
.querySelectorAll(".musicBtn")
.forEach(x =>
x.classList.remove("selected")
);

button.classList.add("selected");

selectedMusic =
Number(button.dataset.music);

};

});


document.getElementById(
"chooseAnimalBtn"
).onclick = ()=>{

menuScreen.classList.remove("active");

animalScreen.classList.add("active");

showPage(1);

};


document.getElementById(
"backBtn"
).onclick = ()=>{

animalScreen.classList.remove("active");

menuScreen.classList.add("active");

};


function stopMusic(){

if(musicTimer){
clearTimeout(musicTimer);
musicTimer = null;
}

if(audioContext){
audioContext.close();
audioContext = null;
}

}


function startMusic(){

stopMusic();

try{

const AudioContext =
window.AudioContext ||
window.webkitAudioContext;

audioContext = new AudioContext();

let notes;

if(selectedMusic === 1){

notes = [
261.63,329.63,392,
329.63,293.66,349.23,
440,392
];

}

else if(selectedMusic === 2){

notes = [
110,110,146.83,130.81,
110,164.81,146.83,110
];

}

else{

notes = [
261.63,293.66,329.63,
392,329.63,293.66,
261.63,220
];

}

let i = 0;

function playNote(){

if(!running) return;

const osc =
audioContext.createOscillator();

const gain =
audioContext.createGain();

osc.type =
selectedMusic === 2
? "square"
: "triangle";

osc.frequency.value =
notes[i % notes.length];

gain.gain.setValueAtTime(
0.018,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.001,
audioContext.currentTime + .28
);

osc.connect(gain);

gain.connect(audioContext.destination);

osc.start();

osc.stop(
audioContext.currentTime + .3
);

i++;

musicTimer =
setTimeout(
playNote,
selectedMusic === 2 ? 260 : 400
);

}

playNote();

}catch(e){}

}


document.getElementById(
"startBtn"
).onclick = startGame;


function startGame(){

if(!playerName.value.trim()){

alert("Nhập tên người chơi trước nhé!");

playerName.focus();

return;

}

animalScreen.classList.remove("active");

gameScreen.classList.add("active");

score = 0;

scoreText.textContent = "0";

playerY =
game.clientHeight * .4;

velocity = 0;

pipes.forEach(pipe=>{

pipe.top.remove();
pipe.bottom.remove();

});

pipes = [];

spawnTimer = 0;

player.textContent =
selectedAnimal;

player.style.left =
Math.min(
game.clientWidth * .25,
180
) + "px";

player.style.top =
playerY + "px";

gameOver.style.display = "none";

running = true;

startMusic();

lastTime =
performance.now();

cancelAnimationFrame(animation);

animation =
requestAnimationFrame(loop);

}


function jump(){

if(!running) return;

velocity = -8.5;

}


document.addEventListener(
"keydown",
e=>{

if(
e.code === "Space" ||
e.code === "ArrowUp"
){

e.preventDefault();

jump();

}

});


game.addEventListener(
"pointerdown",
()=>{

if(running) jump();

});


function createPipe(){

const setting =
settings[difficulty];

const height =
game.clientHeight;

const ground =
height * .25;

const maxTop =
height -
ground -
setting.gap -
100;

const minTop = 70;

const topHeight =
Math.random() *
(maxTop-minTop) +
minTop;

const bottomHeight =
height -
ground -
topHeight -
setting.gap;

const top =
document.createElement("div");

top.className = "pipe top";

top.style.height =
topHeight + "px";

top.style.left =
game.clientWidth + "px";


const bottom =
document.createElement("div");

bottom.className = "pipe bottom";

bottom.style.height =
bottomHeight + "px";

bottom.style.left =
game.clientWidth + "px";


game.appendChild(top);

game.appendChild(bottom);


pipes.push({

top,
bottom,

x:game.clientWidth,

topHeight,

bottomHeight,

passed:false

});

}


function collision(){

const px =
parseFloat(player.style.left);

const py = playerY;

const pw =
player.offsetWidth;

const ph =
player.offsetHeight;

const ground =
game.clientHeight * .75;


if(
py < 0 ||
py + ph > ground
){

return true;

}


for(const pipe of pipes){

const pipeWidth = 65;

const hitX =
px + pw > pipe.x &&
px < pipe.x + pipeWidth;

if(!hitX) continue;

if(
py < pipe.topHeight ||
py + ph >
pipe.topHeight +
settings[difficulty].gap
){

return true;

}

}

return false;

}


function loop(time){

if(!running) return;

const delta =
Math.min(
(time-lastTime)/16.67,
2
);

lastTime = time;

const setting =
settings[difficulty];

velocity +=
0.42 * delta;

playerY +=
velocity * delta;

player.style.top =
playerY + "px";

spawnTimer +=
delta * 16.67;


if(spawnTimer >= setting.spawn){

spawnTimer = 0;

createPipe();

}


for(let i=pipes.length-1;i>=0;i--){

const pipe = pipes[i];

pipe.x -=
setting.speed * delta;

pipe.top.style.left =
pipe.x + "px";

pipe.bottom.style.left =
pipe.x + "px";


if(
!pipe.passed &&
pipe.x + 65 <
parseFloat(player.style.left)
){

pipe.passed = true;

score++;

scoreText.textContent =
score;

}


if(pipe.x < -100){

pipe.top.remove();

pipe.bottom.remove();

pipes.splice(i,1);

}

}


if(collision()){

endGame();

return;

}


animation =
requestAnimationFrame(loop);

}


function endGame(){

running = false;

cancelAnimationFrame(animation);

stopMusic();


if(score > best){

best = score;

localStorage.setItem(
"animalJumpBest",
best
);

}


finalScore.textContent =
"🏆 Điểm: " + score;

document.getElementById(
"bestScore"
).textContent =
"⭐ Kỷ lục: " + best;

gameOver.style.display = "flex";

}


document.getElementById(
"retryBtn"
).onclick = ()=>{

startGame();

};


document.getElementById(
"menuBtn"
).onclick = ()=>{

running = false;

stopMusic();

cancelAnimationFrame(animation);

pipes.forEach(pipe=>{

pipe.top.remove();

pipe.bottom.remove();

});

pipes = [];

gameOver.style.display = "none";

gameScreen.classList.remove("active");

menuScreen.classList.add("active");

};

</script>

</body>
</html>
