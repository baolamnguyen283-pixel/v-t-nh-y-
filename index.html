 <!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animal Jump</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#18252c;
}

canvas{
 width:100%;
 height:100%;
 display:block;
}

#menu{
 position:fixed;
 inset:0;
 z-index:10;
 overflow:auto;
 padding:20px;
 text-align:center;
 color:white;

 background:
 linear-gradient(
  180deg,
  rgba(44,157,201,.95),
  rgba(69,166,91,.95)
 );

 display:flex;
 flex-direction:column;
 align-items:center;
}

.logo{
 font-size:55px;
 font-weight:900;
 text-shadow:4px 4px #34535d;
 margin:5px 0;
}

#playerName{
 width:300px;
 padding:12px;
 border-radius:14px;
 border:3px solid white;
 outline:none;
 text-align:center;
 font-size:18px;
 font-weight:bold;
 margin:8px;
}

.title{
 font-size:20px;
 font-weight:bold;
 margin:8px;
}

.animals{
 width:min(760px,95vw);
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:8px;
}

.choice{
 min-height:67px;
 border:3px solid white;
 border-radius:14px;
 background:rgba(255,255,255,.16);
 color:white;
 cursor:pointer;
 font-weight:bold;
}

.choice:hover{
 transform:scale(1.04);
}

.choice.selected{
 background:#ffd447;
 color:#332600;
}

.icon{
 display:block;
 font-size:27px;
}

.modes{
 display:flex;
 gap:8px;
}

.mode{
 width:100px;
}

#start{
 margin:18px;
 padding:14px 45px;
 border:0;
 border-radius:16px;
 background:#ffc332;
 color:#3c2c00;
 font-size:22px;
 font-weight:900;
 cursor:pointer;
 box-shadow:0 6px #a36d08;
}

#music{
 position:fixed;
 right:15px;
 top:15px;
 z-index:30;

 padding:10px 15px;
 border:0;
 border-radius:12px;

 background:white;
 font-weight:bold;
 cursor:pointer;
}

#score{
 position:fixed;
 top:10px;
 left:50%;
 transform:translateX(-50%);
 z-index:5;

 color:white;
 font-size:38px;
 font-weight:900;

 text-shadow:3px 3px #263b43;
}

#playerLabel{
 position:fixed;
 top:58px;
 left:50%;
 transform:translateX(-50%);
 z-index:5;

 color:white;
 font-weight:bold;
 text-shadow:2px 2px #263b43;
}

#over{
 position:fixed;
 inset:0;
 z-index:20;
 display:none;

 flex-direction:column;
 align-items:center;
 justify-content:center;

 background:rgba(0,0,0,.6);
 color:white;
 text-align:center;
}

#over h1{
 font-size:60px;
 margin:0;
}

#again{
 padding:13px 38px;
 border:0;
 border-radius:14px;
 background:#ffd447;
 font-size:20px;
 font-weight:bold;
 cursor:pointer;
}

@media(max-width:700px){

 .animals{
  grid-template-columns:repeat(4,1fr);
 }

 .logo{
  font-size:40px;
 }

 .choice{
  font-size:11px;
 }

 .icon{
  font-size:23px;
 }
}
</style>
</head>

<body>

<button id="music">🔇 Nhạc: Tắt</button>

<div id="menu">

<div class="logo">🐾 ANIMAL JUMP</div>

<div>Vượt qua cột và lập kỷ lục!</div>

<input
 id="playerName"
 maxlength="16"
 placeholder="Nhập tên của bạn"
>

<div class="title">🐾 Chọn con vật</div>

<div class="animals" id="animals"></div>

<div class="title">⚡ Độ khó</div>

<div class="modes">

<button class="choice mode selected" data-mode="easy">
🟢 DỄ
</button>

<button class="choice mode" data-mode="normal">
🟡 VỪA
</button>

<button class="choice mode" data-mode="hard">
🔴 KHÓ
</button>

</div>

<button id="start">▶ BẮT ĐẦU CHƠI</button>

</div>

<div id="score">0</div>

<div id="playerLabel"></div>

<div id="over">

<h1>GAME OVER</h1>

<div id="result"></div>

<br>

<button id="again">🔄 VỀ MENU</button>

</div>

<canvas id="game"></canvas>

<script>

/* =========================================
  40 CON VẬT
========================================= */

const animals=[

["duck","🦆","Vịt"],
["cat","🐱","Mèo"],
["dog","🐶","Chó"],
["rabbit","🐰","Thỏ"],
["frog","🐸","Ếch"],
["panda","🐼","Gấu trúc"],
["fox","🦊","Cáo"],
["bee","🐝","Ong"],
["penguin","🐧","Cánh cụt"],
["bear","🐻","Gấu"],

["koala","🐨","Koala"],
["tiger","🐯","Hổ"],
["lion","🦁","Sư tử"],
["cow","🐮","Bò"],
["pig","🐷","Heo"],
["mouse","🐭","Chuột"],
["hamster","🐹","Hamster"],
["monkey","🐵","Khỉ"],
["chicken","🐔","Gà"],
["chick","🐤","Gà con"],

["bird","🐦","Chim"],
["owl","🦉","Cú"],
["parrot","🦜","Vẹt"],
["swan","🦢","Thiên nga"],
["eagle","🦅","Đại bàng"],
["turkey","🦃","Gà tây"],
["horse","🐴","Ngựa"],
["unicorn","🦄","Kỳ lân"],
["llama","🦙","Lạc đà"],
["camel","🐫","Lạc đà"],

["elephant","🐘","Voi"],
["giraffe","🦒","Hươu cao cổ"],
["zebra","🦓","Ngựa vằn"],
["deer","🦌","Nai"],
["boar","🐗","Lợn rừng"],
["goat","🐐","Dê"],
["sheep","🐑","Cừu"],
["wolf","🐺","Sói"],
["dragon","🐲","Rồng"],
["dinosaur","🦖","Khủng long"]

];


/* =========================================
  TẠO MENU CON VẬT
========================================= */

const animalBox=
document.getElementById("animals");

animals.forEach((a,i)=>{

 const button=
 document.createElement("button");

 button.className=
 "choice animal";

 if(i===0)
 button.classList.add("selected");

 button.dataset.animal=
 a[0];

 button.innerHTML=
 `<span class="icon">${a[1]}</span>${a[2]}`;

 animalBox.appendChild(button);

});


let animal="duck";
let mode="easy";
let playerName="Người chơi";


/* =========================================
  CANVAS
========================================= */

const canvas=
document.getElementById("game");

const ctx=
canvas.getContext("2d");

function resize(){

 canvas.width=
 innerWidth;

 canvas.height=
 innerHeight;
}

resize();

addEventListener(
 "resize",
 resize
);


/* =========================================
  ĐỘ KHÓ
========================================= */

const difficulty={

 easy:{
  speed:3.4,
  gap:215,
  spawn:2050
 },

 normal:{
  speed:4.3,
  gap:190,
  spawn:1750
 },

 hard:{
  speed:5.3,
  gap:170,
  spawn:1500
 }

};


/* =========================================
  CHỌN CON VẬT
========================================= */

document
.querySelectorAll(".animal")
.forEach(b=>{

 b.onclick=()=>{

  document
  .querySelectorAll(".animal")
  .forEach(x=>
   x.classList.remove("selected")
  );

  b.classList.add("selected");

  animal=
  b.dataset.animal;

 };

});


/* =========================================
  CHỌN ĐỘ KHÓ
========================================= */

document
.querySelectorAll(".mode")
.forEach(b=>{

 b.onclick=()=>{

  document
  .querySelectorAll(".mode")
  .forEach(x=>
   x.classList.remove("selected")
  );

  b.classList.add("selected");

  mode=
  b.dataset.mode;

 };

});


/* =========================================
  GAME
========================================= */

let playing=false;
let dead=false;

let score=0;

let pipes=[];

let lastPipe=0;

let best=
Number(
 localStorage.getItem(
  "animalJumpBest"
 )
)||0;


const player={

 x:170,
 y:300,

 w:55,
 h:45,

 vy:0

};


const gravity=.50;
const jumpPower=-9;


/* =========================================
  NHẠC BẰNG JAVASCRIPT
========================================= */

let audio=null;
let musicOn=false;
let musicTimer=null;

const musicButton=
document.getElementById("music");


function startMusic(){

 if(musicOn)
 return;

 audio=
 new AudioContext();

 musicOn=true;

 musicButton.textContent=
 "🔊 Nhạc: Bật";

 playMelody();

}


function playMelody(){

 if(!musicOn)
 return;

 const notes=[
  261.63,
  329.63,
  392,
  329.63,
  293.66,
  349.23,
  440,
  392
 ];

 let i=0;

 function note(){

  if(!musicOn)
  return;

  const osc=
  audio.createOscillator();

  const gain=
  audio.createGain();

  osc.frequency.value=
  notes[i];

  osc.type=
  "sine";

  gain.gain.value=
  .035;

  osc.connect(gain);

  gain.connect(
   audio.destination
  );

  osc.start();

  osc.stop(
   audio.currentTime+.18
  );

  i=
  (i+1)%notes.length;

  musicTimer=
  setTimeout(
   note,
   230
  );

 }

 note();

}


function stopMusic(){

 musicOn=false;

 if(musicTimer)
 clearTimeout(musicTimer);

 if(audio)
 audio.close();

 musicButton.textContent=
 "🔇 Nhạc: Tắt";

}


musicButton.onclick=()=>{

 if(musicOn)
 stopMusic();

 else
 startMusic();

};


/* =========================================
  BẮT ĐẦU
========================================= */

document
.getElementById("start")
.onclick=()=>{

 playerName=
 document
 .getElementById("playerName")
 .value
 .trim();

 if(!playerName)
 playerName="Người chơi";


 /* trình duyệt cho phép nhạc
    sau khi người dùng bấm */

 if(!musicOn)
 startMusic();


 playing=true;
 dead=false;

 score=0;

 pipes=[];

 player.y=
 canvas.height/2;

 player.vy=0;

 lastPipe=
 performance.now();

 document
 .getElementById("score")
 .textContent="0";

 document
 .getElementById("playerLabel")
 .textContent=
 "👤 "+playerName;

 document
 .getElementById("menu")
 .style.display="none";

 document
 .getElementById("over")
 .style.display="none";

};


/* =========================================
  NHẢY
========================================= */

function jump(){

 if(!playing || dead)
 return;

 player.vy=
 jumpPower;

}

addEventListener(
 "keydown",
 e=>{

  if(e.code==="Space"){

   e.preventDefault();

   jump();

  }

 }
);

canvas.addEventListener(
 "pointerdown",
 jump
);


/* =========================================
  TẠO CỘT
========================================= */

function createPipe(){

 const d=
 difficulty[mode];

 const ground=
 canvas.height-65;

 /*
   Khe được giới hạn để:
   - Không quá lớn
   - Không quá nhỏ
 */

 const topMin=100;

 const topMax=
 Math.max(
  topMin,
  ground-d.gap-100
 );

 const top=
 topMin+
 Math.random()*
 (topMax-topMin);


 pipes.push({

  x:
  canvas.width+100,

  w:86,

  top:top,

  bottom:
  top+d.gap,

  passed:false

 });

}


/* =========================================
  UPDATE
========================================= */

function update(time){

 if(!playing || dead)
 return;


 const d=
 difficulty[mode];


 player.vy+=
 gravity;

 player.y+=
 player.vy;


 if(
  time-lastPipe>
  d.spawn
 ){

  createPipe();

  lastPipe=time;

 }


 for(
  const p of pipes
 ){

  p.x-=
  d.speed;


  const px=
  player.x+8;

  const py=
  player.y+7;

  const pw=
  player.w-16;

  const ph=
  player.h-12;


  const hitX=
  px+pw>p.x &&
  px<p.x+p.w;


  const hitTop=
  py<p.top;

  const hitBottom=
  py+ph>p.bottom;


  if(
   hitX &&
   (hitTop||hitBottom)
  ){

   endGame();

  }


  if(
   !p.passed &&
   p.x+p.w<
   player.x
  ){

   p.passed=true;

   score++;

   document
   .getElementById("score")
   .textContent=
   score;

  }

 }


 pipes=
 pipes.filter(
  p=>p.x>-150
 );


 if(player.y<0)
 endGame();


 if(
  player.y+
  player.h>
  canvas.height-65
 )
 endGame();

}


/* =========================================
  GAME OVER
========================================= */

function endGame(){

 if(dead)
 return;

 dead=true;
 playing=false;


 if(score>best){

  best=score;

  localStorage.setItem(
   "animalJumpBest",
   best
  );

 }


 document
 .getElementById("result")
 .innerHTML=
 `
 👤 ${playerName}<br>
 🐾 ${animals.find(a=>a[0]===animal)?.[2]||""}<br>
 🏆 Điểm: <b>${score}</b><br>
 ⭐ Kỷ lục: <b>${best}</b>
 `;


 document
 .getElementById("over")
 .style.display="flex";

}


/* =========================================
  VỀ MENU
========================================= */

document
.getElementById("again")
.onclick=()=>{

 document
 .getElementById("over")
 .style.display="none";

 document
 .getElementById("menu")
 .style.display="flex";

 pipes=[];

 score=0;

 document
 .getElementById("score")
 .textContent="0";

 document
 .getElementById("playerLabel")
 .textContent="";

};


/* =========================================
  NỀN
========================================= */

function background(){

 const sky=
 ctx.createLinearGradient(
  0,0,
  0,canvas.height
 );

 sky.addColorStop(
  0,
  "#55bfe3"
 );

 sky.addColorStop(
  1,
  "#d9f7ff"
 );

 ctx.fillStyle=sky;

 ctx.fillRect(
  0,0,
  canvas.width,
  canvas.height
 );


 /* mặt trời */

 ctx.fillStyle="#ffe47a";

 ctx.beginPath();

 ctx.arc(
  canvas.width-100,
  90,
  42,
  0,
  Math.PI*2
 );

 ctx.fill();


 cloud(
  130,
  100,
  30
 );

 cloud(
  canvas.width*.55,
  145,
  27
 );

}


function cloud(x,y,s){

 ctx.fillStyle=
 "rgba(255,255,255,.8)";

 ctx.beginPath();

 ctx.arc(
  x,y,s,
  0,Math.PI*2
 );

 ctx.arc(
  x+s,
  y-8,
  s*.75,
  0,Math.PI*2
 );

 ctx.arc(
  x+s*2,
  y,
  s,
  0,Math.PI*2
 );

 ctx.fill();

}


/* =========================================
  CỘT ĐẸP
========================================= */

function drawPipe(p){

 const x=p.x;
 const w=p.w;


 const g=
 ctx.createLinearGradient(
  x,0,
  x+w,0
 );

 g.addColorStop(
  0,
  "#125b29"
 );

 g.addColorStop(
  .25,
  "#2d9e42"
 );

 g.addColorStop(
  .5,
  "#5acb61"
 );

 g.addColorStop(
  .75,
  "#2c9b41"
 );

 g.addColorStop(
  1,
  "#0c5225"
 );


 ctx.fillStyle=g;


 /* thân trên */

 ctx.fillRect(
  x,0,
  w,p.top
 );


 /* thân dưới */

 ctx.fillRect(
  x,p.bottom,
  w,
  canvas.height-p.bottom
 );


 /* đầu cột */

 ctx.fillStyle=
 "#45b953";


 ctx.fillRect(
  x-8,
  p.top-28,
  w+16,
  28
 );


 ctx.fillRect(
  x-8,
  p.bottom,
  w+16,
  28
 );


 /* viền */

 ctx.strokeStyle=
 "#104e25";

 ctx.lineWidth=4;


 ctx.strokeRect(
  x,0,
  w,p.top
 );

 ctx.strokeRect(
  x,p.bottom,
  w,
  canvas.height-p.bottom
 );


 ctx.strokeRect(
  x-8,
  p.top-28,
  w+16,
  28
 );

 ctx.strokeRect(
  x-8,
  p.bottom,
  w+16,
  28
 );


 /* ánh sáng */

 ctx.fillStyle=
 "rgba(255,255,255,.18)";

 ctx.fillRect(
  x+12,
  0,
  7,
  p.top
 );

 ctx.fillRect(
  x+12,
  p.bottom,
  7,
  canvas.height
 );

}


/* =========================================
  NHÂN VẬT
========================================= */

function drawPlayer(){

 const emoji=
 animals.find(
  a=>a[0]===animal
 )?.[1] || "🦆";


 /*
   Dùng emoji cho 40 con vật.
   Canvas tự vẽ emoji nên không bị
   ngược như ảnh cũ.
 */

 ctx.font=
 "48px Arial";

 ctx.textAlign=
 "center";

 ctx.textBaseline=
 "middle";

 ctx.fillText(
  emoji,
  player.x+player.w/2,
  player.y+player.h/2
 );

}


/* =========================================
  ĐẤT
========================================= */

function ground(){

 const y=
 canvas.height-65;


 ctx.fillStyle=
 "#73c94c";

 ctx.fillRect(
  0,y,
  canvas.width,
  65
 );


 ctx.fillStyle=
 "#a0dd59";

 for(
  let x=0;
  x<canvas.width;
  x+=18
 ){

  ctx.beginPath();

  ctx.moveTo(
   x,y
  );

  ctx.lineTo(
   x+6,y-8
  );

  ctx.lineTo(
   x+12,y
  );

  ctx.fill();

 }


 ctx.fillStyle=
 "#a97543";

 ctx.fillRect(
  0,
  canvas.height-18,
  canvas.width,
  18
 );

}


/* =========================================
  DRAW
========================================= */

function draw(){

 background();

 for(
  const p of pipes
 ){

  drawPipe(p);

 }

 ground();

 if(
  playing ||
  dead
 ){

  drawPlayer();

 }

}


/* =========================================
  GAME LOOP
========================================= */

function loop(time){

 update(time);

 draw();

 requestAnimationFrame(
  loop
 );

}

requestAnimationFrame(
 loop
);

</script>

</body>
</html>
