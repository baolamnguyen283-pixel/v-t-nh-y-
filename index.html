 <!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Animal Jump</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#17242b;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* ================= MENU ================= */

#menu{
    position:fixed;
    inset:0;
    z-index:10;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:white;
    text-align:center;

    background:
    linear-gradient(
        180deg,
        rgba(39,153,198,.92),
        rgba(65,165,91,.92)
    );

    overflow:auto;
    padding:20px;
}

.logo{
    font-size:58px;
    font-weight:900;

    text-shadow:
    4px 4px 0 #31515c;

    margin-bottom:4px;
}

.description{
    margin-bottom:14px;
    font-size:18px;
}

label{
    font-size:18px;
    font-weight:bold;
}

#playerName{
    width:310px;
    max-width:90vw;

    margin:7px 0 12px;

    padding:12px 16px;

    border:3px solid white;
    border-radius:14px;

    outline:none;

    text-align:center;

    font-size:18px;
    font-weight:bold;
}

.title{
    margin:8px 0;
    font-size:20px;
    font-weight:bold;
}

.animals{
    display:grid;

    grid-template-columns:
    repeat(4,120px);

    gap:10px;

    justify-content:center;
}

.choice{
    min-height:76px;

    border:3px solid rgba(255,255,255,.9);
    border-radius:16px;

    background:rgba(255,255,255,.16);

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:.15s;
}

.choice:hover{
    transform:translateY(-3px);
}

.choice.selected{
    background:#ffd447;
    color:#332b13;

    box-shadow:
    0 5px 0 rgba(90,60,0,.3);
}

.icon{
    display:block;
    font-size:30px;
    margin-bottom:3px;
}

.modes{
    display:flex;
    gap:10px;
    margin-top:4px;
}

.mode{
    width:105px;
    min-height:50px;
}

#start{
    margin-top:20px;

    padding:15px 48px;

    border:0;
    border-radius:17px;

    background:#ffbd2f;
    color:#382700;

    font-size:23px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
    0 6px 0 #a96e08;
}

#start:active{
    transform:translateY(5px);
    box-shadow:
    0 1px 0 #a96e08;
}

/* ================= SCORE ================= */

#score{
    position:fixed;
    top:12px;
    left:50%;

    transform:translateX(-50%);

    z-index:5;

    color:white;

    font-size:38px;
    font-weight:900;

    text-shadow:
    3px 3px 0 #273b43;
}

#playerLabel{
    position:fixed;
    top:57px;
    left:50%;

    transform:translateX(-50%);

    z-index:5;

    color:white;

    font-size:16px;
    font-weight:bold;

    text-shadow:
    2px 2px 0 #273b43;
}

/* ================= GAME OVER ================= */

#over{
    position:fixed;
    inset:0;

    z-index:20;

    display:none;

    align-items:center;
    justify-content:center;
    flex-direction:column;

    color:white;
    text-align:center;

    background:rgba(20,30,35,.63);
}

#over h1{
    margin:0;

    font-size:62px;

    text-shadow:
    4px 4px 0 #26343a;
}

#result{
    margin:10px 0;
    font-size:23px;
}

#again{
    margin-top:14px;

    padding:14px 40px;

    border:0;
    border-radius:15px;

    background:#ffd447;

    color:#302500;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:650px){

    .logo{
        font-size:42px;
    }

    .animals{
        grid-template-columns:
        repeat(4,78px);
        gap:7px;
    }

    .choice{
        min-height:65px;
        font-size:12px;
    }

    .icon{
        font-size:25px;
    }

    .modes{
        gap:6px;
    }

    .mode{
        width:90px;
    }

    #start{
        padding:13px 35px;
    }
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu">

    <div class="logo">
        ANIMAL JUMP
    </div>

    <div class="description">
        Vượt qua các cây cột và lập kỷ lục!
    </div>

    <label for="playerName">
        Nhập tên của bạn
    </label>

    <input
        id="playerName"
        type="text"
        maxlength="16"
        placeholder="Ví dụ: BaoLam"
        autocomplete="off"
    >

    <div class="title">
        🐾 Chọn con vật
    </div>

    <div class="animals">

        <button class="choice animal selected"
                data-animal="duck">
            <span class="icon">🦆</span>
            Vịt
        </button>

        <button class="choice animal"
                data-animal="cat">
            <span class="icon">🐱</span>
            Mèo
        </button>

        <button class="choice animal"
                data-animal="rabbit">
            <span class="icon">🐰</span>
            Thỏ
        </button>

        <button class="choice animal"
                data-animal="frog">
            <span class="icon">🐸</span>
            Ếch
        </button>

        <button class="choice animal"
                data-animal="panda">
            <span class="icon">🐼</span>
            Gấu trúc
        </button>

        <button class="choice animal"
                data-animal="fox">
            <span class="icon">🦊</span>
            Cáo
        </button>

        <button class="choice animal"
                data-animal="bee">
            <span class="icon">🐝</span>
            Ong
        </button>

        <button class="choice animal"
                data-animal="penguin">
            <span class="icon">🐧</span>
            Chim cánh cụt
        </button>

    </div>

    <div class="title">
        ⚡ Chọn độ khó
    </div>

    <div class="modes">

        <button class="choice mode selected"
                data-mode="easy">
            🟢 DỄ
        </button>

        <button class="choice mode"
                data-mode="normal">
            🟡 VỪA
        </button>

        <button class="choice mode"
                data-mode="hard">
            🔴 KHÓ
        </button>

    </div>

    <button id="start">
        ▶ BẮT ĐẦU CHƠI
    </button>

</div>


<!-- ================= GAME UI ================= -->

<div id="score">0</div>

<div id="playerLabel"></div>


<!-- ================= GAME OVER ================= -->

<div id="over">

    <h1>GAME OVER</h1>

    <div id="result"></div>

    <button id="again">
        🔄 VỀ MENU
    </button>

</div>


<canvas id="game"></canvas>


<script>

/* =================================================
   CANVAS
================================================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


function resize(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =================================================
   MENU
================================================= */

const menu =
document.getElementById("menu");

const over =
document.getElementById("over");

const scoreText =
document.getElementById("score");

const playerLabel =
document.getElementById("playerLabel");

const result =
document.getElementById("result");

const nameInput =
document.getElementById("playerName");


let animal =
"duck";

let mode =
"easy";

let playerName =
"Người chơi";


/* =================================================
   ĐỘ KHÓ
================================================= */

const difficulty = {

    easy:{
        speed:3.2,
        gap:235,
        spawn:2050
    },

    normal:{
        speed:4.3,
        gap:200,
        spawn:1750
    },

    hard:{
        speed:5.6,
        gap:170,
        spawn:1500
    }

};


/* =================================================
   CHỌN CON VẬT
================================================= */

document
.querySelectorAll(".animal")
.forEach(button=>{

    button.onclick=()=>{

        document
        .querySelectorAll(".animal")
        .forEach(b=>
            b.classList.remove("selected")
        );

        button.classList.add("selected");

        animal =
        button.dataset.animal;

    };

});


/* =================================================
   CHỌN ĐỘ KHÓ
================================================= */

document
.querySelectorAll(".mode")
.forEach(button=>{

    button.onclick=()=>{

        document
        .querySelectorAll(".mode")
        .forEach(b=>
            b.classList.remove("selected")
        );

        button.classList.add("selected");

        mode =
        button.dataset.mode;

    };

});


/* =================================================
   GAME VARIABLES
================================================= */

let playing =
false;

let dead =
false;

let score =
0;

let pipes =
[];

let lastPipe =
0;


/* =================================================
   KỶ LỤC
================================================= */

let best =
Number(
    localStorage.getItem(
        "animalJumpBest"
    )
) || 0;


/* =================================================
   PLAYER
================================================= */

const player = {

    x:170,

    y:300,

    w:58,

    h:48,

    vy:0

};

const gravity =
0.50;

const jumpPower =
-9;


/* =================================================
   START GAME
================================================= */

document
.getElementById("start")
.onclick =
startGame;


function startGame(){

    playerName =
    nameInput.value.trim();

    if(!playerName){

        playerName =
        "Người chơi";

    }


    playing =
    true;

    dead =
    false;

    score =
    0;

    pipes =
    [];

    player.x =
    170;

    player.y =
    canvas.height / 2;

    player.vy =
    0;

    lastPipe =
    performance.now();

    scoreText.textContent =
    "0";

    playerLabel.textContent =
    "👤 " + playerName;

    menu.style.display =
    "none";

    over.style.display =
    "none";

}


/* =================================================
   JUMP
================================================= */

function jump(){

    if(
        !playing ||
        dead
    ) return;

    player.vy =
    jumpPower;

}


/* =================================================
   SPACE
================================================= */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.code === "Space"
        ){

            e.preventDefault();

            jump();

        }

    }
);


/* =================================================
   CLICK / TOUCH
================================================= */

canvas.addEventListener(
    "pointerdown",
    jump
);


/* =================================================
   CREATE PIPE
================================================= */

function createPipe(){

    const d =
    difficulty[mode];

    const ground =
    canvas.height - 65;


    /*
      Giữ khoảng cách an toàn
      giữa trần và mặt đất.
    */

    const minTop =
    90;

    const maxTop =
    Math.max(
        minTop,
        ground -
        d.gap -
        90
    );


    const top =
    minTop +
    Math.random() *
    (maxTop-minTop);


    pipes.push({

        x:
        canvas.width + 100,

        w:
        92,

        top:
        top,

        bottom:
        top + d.gap,

        passed:
        false

    });

}


/* =================================================
   UPDATE
================================================= */

function update(time){

    if(
        !playing ||
        dead
    ) return;


    const d =
    difficulty[mode];


    /* trọng lực */

    player.vy +=
    gravity;

    player.y +=
    player.vy;


    /* tạo cột */

    if(
        time-lastPipe >
        d.spawn
    ){

        createPipe();

        lastPipe =
        time;

    }


    /* kiểm tra cột */

    for(
        const p of pipes
    ){

        p.x -=
        d.speed;


        /* hitbox nhỏ hơn hình */

        const px =
        player.x + 8;

        const py =
        player.y + 7;

        const pw =
        player.w - 16;

        const ph =
        player.h - 12;


        const hitX =
        px + pw > p.x &&
        px < p.x + p.w;


        const hitTop =
        py < p.top;


        const hitBottom =
        py + ph > p.bottom;


        if(
            hitX &&
            (
                hitTop ||
                hitBottom
            )
        ){

            endGame();

        }


        /* điểm */

        if(
            !p.passed &&
            p.x+p.w <
            player.x
        ){

            p.passed =
            true;

            score++;

            scoreText.textContent =
            score;

        }

    }


    pipes =
    pipes.filter(
        p =>
        p.x > -150
    );


    /* đụng trần */

    if(
        player.y < 0
    ){

        endGame();

    }


    /* đụng đất */

    if(
        player.y +
        player.h >
        canvas.height - 65
    ){

        endGame();

    }

}


/* =================================================
   GAME OVER
================================================= */

function endGame(){

    if(dead)
    return;

    dead =
    true;

    playing =
    false;


    if(
        score > best
    ){

        best =
        score;

        localStorage.setItem(
            "animalJumpBest",
            best
        );

    }


    result.innerHTML =

    `👤 ${playerName}<br>
     🏆 Điểm: <b>${score}</b><br>
     ⭐ Kỷ lục: <b>${best}</b>`;

    over.style.display =
    "flex";

}


/* =================================================
   VỀ MENU
================================================= */

document
.getElementById("again")
.onclick=()=>{

    over.style.display =
    "none";

    menu.style.display =
    "flex";

    pipes =
    [];

    score =
    0;

    scoreText.textContent =
    "0";

    playerLabel.textContent =
    "";

};


/* =================================================
   BACKGROUND
================================================= */

function drawBackground(){

    const sky =
    ctx.createLinearGradient(
        0,0,
        0,canvas.height
    );

    sky.addColorStop(
        0,
        "#55bde0"
    );

    sky.addColorStop(
        1,
        "#d8f6ff"
    );

    ctx.fillStyle =
    sky;

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    /* mặt trời */

    ctx.fillStyle =
    "#ffe27a";

    ctx.beginPath();

    ctx.arc(
        canvas.width-100,
        90,
        43,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* mây */

    drawCloud(
        120,100,32
    );

    drawCloud(
        canvas.width*.52,
        150,
        27
    );

    drawCloud(
        canvas.width*.82,
        75,
        30
    );

}


/* =================================================
   CLOUD
================================================= */

function drawCloud(x,y,s){

    ctx.fillStyle =
    "rgba(255,255,255,.8)";

    ctx.beginPath();

    ctx.arc(
        x,y,s,
        0,Math.PI*2
    );

    ctx.arc(
        x+s,
        y-s*.25,
        s*.75,
        0,Math.PI*2
    );

    ctx.arc(
        x+s*2,
        y,
        s,
        0,Math.PI*2
    );

    ctx.fill();

}


/* =================================================
   CỘT ĐẸP
================================================= */

function drawPipe(p){

    const x =
    p.x;

    const w =
    p.w;


    /*
       GRADIENT CỘT
    */

    const gradient =
    ctx.createLinearGradient(
        x,0,
        x+w,0
    );

    gradient.addColorStop(
        0,
        "#12672d"
    );

    gradient.addColorStop(
        .25,
        "#38a94b"
    );

    gradient.addColorStop(
        .5,
        "#53c85d"
    );

    gradient.addColorStop(
        .75,
        "#29983e"
    );

    gradient.addColorStop(
        1,
        "#0e5c29"
    );


    ctx.fillStyle =
    gradient;


    /* ==================
       CỘT TRÊN
    ================== */

    ctx.fillRect(
        x,
        0,
        w,
        p.top
    );


    /* ==================
       CỘT DƯỚI
    ================== */

    ctx.fillRect(
        x,
        p.bottom,
        w,
        canvas.height-p.bottom
    );


    /* ==================
       ĐẦU CỘT
    ================== */

    ctx.fillStyle =
    "#43b953";


    /* đầu trên */

    ctx.fillRect(
        x-9,
        p.top-30,
        w+18,
        30
    );


    /* đầu dưới */

    ctx.fillRect(
        x-9,
        p.bottom,
        w+18,
        30
    );


    /* ==================
       VIỀN
    ================== */

    ctx.strokeStyle =
    "#0d5427";

    ctx.lineWidth =
    4;


    ctx.strokeRect(
        x,
        0,
        w,
        p.top
    );


    ctx.strokeRect(
        x,
        p.bottom,
        w,
        canvas.height-p.bottom
    );


    ctx.strokeRect(
        x-9,
        p.top-30,
        w+18,
        30
    );


    ctx.strokeRect(
        x-9,
        p.bottom,
        w+18,
        30
    );


    /* ==================
       BÓNG
    ================== */

    ctx.fillStyle =
    "rgba(255,255,255,.16)";

    ctx.fillRect(
        x+12,
        0,
        8,
        p.top
    );

    ctx.fillRect(
        x+12,
        p.bottom,
        8,
        canvas.height-p.bottom
    );


    /* ==================
       DÂY LEO
    ================== */

    ctx.strokeStyle =
    "#78c94d";

    ctx.lineWidth =
    4;

    ctx.beginPath();

    ctx.moveTo(
        x+w-12,
        0
    );

    for(
        let y=30;
        y<p.top-30;
        y+=30
    ){

        ctx.lineTo(
            x+w-12 +
            Math.sin(y*.2)*5,
            y
        );

    }

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        x+w-12,
        p.bottom
    );

    for(
        let y=p.bottom+30;
        y<canvas.height;
        y+=30
    ){

        ctx.lineTo(
            x+w-12 +
            Math.sin(y*.2)*5,
            y
        );

    }

    ctx.stroke();

}


/* =================================================
   NHÂN VẬT
================================================= */

function drawPlayer(){

    const x =
    player.x;

    const y =
    player.y;


    if(animal==="duck")
        drawDuck(x,y);

    else if(animal==="cat")
        drawCat(x,y);

    else if(animal==="rabbit")
        drawRabbit(x,y);

    else if(animal==="frog")
        drawFrog(x,y);

    else if(animal==="panda")
        drawPanda(x,y);

    else if(animal==="fox")
        drawFox(x,y);

    else if(animal==="bee")
        drawBee(x,y);

    else if(animal==="penguin")
        drawPenguin(x,y);

}


/* =================================================
   MẮT
================================================= */

function eye(x,y){

    ctx.fillStyle =
    "white";

    ctx.beginPath();

    ctx.arc(
        x,y,6,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle =
    "#111";

    ctx.beginPath();

    ctx.arc(
        x+1,y,3,
        0,Math.PI*2
    );

    ctx.fill();

}


/* =================================================
   VỊT
================================================= */

function drawDuck(x,y){

    ctx.fillStyle =
    "#ffd83d";

    ctx.beginPath();

    ctx.ellipse(
        x+27,y+28,
        27,19,
        0,0,Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
    "#ffe34d";

    ctx.beginPath();

    ctx.arc(
        x+43,y+14,
        19,
        0,Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
    "#ef8124";

    ctx.beginPath();

    ctx.moveTo(
        x+57,y+13
    );

    ctx.lineTo(
        x+78,y+20
    );

    ctx.lineTo(
        x+57,y+27
    );

    ctx.closePath();

    ctx.fill();

    eye(
        x+49,
        y+8
    );

}


/* =================================================
   MÈO
================================================= */

function drawCat(x,y){

    ctx.fillStyle =
    "#e7a15d";


    ctx.beginPath();

    ctx.moveTo(
        x+8,y+17
    );

    ctx.lineTo(
        x+14,y-5
    );

    ctx.lineTo(
        x+27,y+12
    );

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        x+36,y+12
    );

    ctx.lineTo(
        x+50,y-5
    );

    ctx.lineTo(
        x+55,y+18
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x+31,y+27,
        25,
        0,Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.ellipse(
        x+27,y+47,
        25,14,
        0,0,Math.PI*2
    );

    ctx.fill();


    eye(x+22,y+22);
    eye(x+40,y+22);

}


/* =================================================
   THỎ
================================================= */

function drawRabbit(x,y){

    ctx.fillStyle =
    "#f5f5f5";


    ctx.beginPath();

    ctx.ellipse(
        x+18,y+2,
        9,28,
        -.15,
        0,Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.ellipse(
        x+42,y+2,
        9,28,
        .15,
        0,Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x+30,y+29,
        24,
        0,Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.ellipse(
        x+27,y+48,
        25,14,
        0,0,Math.PI*2
    );

    ctx.fill();


    eye(x+22,y+24);
    eye(x+38,y+24);

}


/* =================================================
   ẾCH
================================================= */

function drawFrog(x,y){

    ctx.fillStyle =
    "#56bd44";

    ctx.beginPath();

    ctx.ellipse(
        x+30,y+29,
        29,22,
        0,0,Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x+13,y+12,
        11,
        0,Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x+47,y+12,
        11,
        0,Math.PI*2
    );

    ctx.fill();


    eye(x+13,y+12);
    eye(x+47,y+12);

}

/* =================================================
   MẶT ĐẤT
================================================= */

function drawGround(){

    const y =
    canvas.height - 65;


    ctx.fillStyle =
    "#70c44a";

    ctx.fillRect(
        0,
        y,
        canvas.width,
        65
    );


    /* cỏ */

    ctx.fillStyle =
    "#9ddd58";

    for(
        let x=0;
        x<canvas.width;
        x+=18
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,y
        );

        ctx.lineTo(
            x+6,y-9
        );

        ctx.lineTo(
            x+12,y
        );

        ctx.fill();

    }


    /* đất */

    ctx.fillStyle =
    "#a87543";

    ctx.fillRect(
        0,
        canvas.height-18,
        canvas.width,
        18
    );

}


/* =================================================
   DRAW
================================================= */

function draw(){

    drawBackground();

    for(
        const p of pipes
    ){

        drawPipe(p);

    }

    drawGround();


    if(
        playing ||
        dead
    ){

        drawPlayer();

    }

}


/* =================================================
   GAME LOOP
================================================= */

function loop(time){

    update(time);

    draw();

    requestAnimationFrame(
        loop
    );

}

requestAnimationFrame(
    loop
);

</script>
