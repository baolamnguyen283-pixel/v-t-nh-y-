 <!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animal Jump</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#7ed8ff,#e9fbff);
  min-height:100vh;
  overflow:hidden;
}

button,input{font:inherit}

#app{
  width:100%;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.screen{
  width:100%;
  max-width:440px;
  max-height:96vh;
  overflow:auto;
  background:rgba(255,255,255,.97);
  border-radius:25px;
  padding:24px;
  box-shadow:0 15px 45px rgba(0,0,0,.2);
  text-align:center;
}

.hidden{display:none!important}

h1{
  font-size:40px;
  margin-bottom:5px;
}

.sub{
  color:#666;
  margin-bottom:18px;
}

label{
  display:block;
  text-align:left;
  font-weight:bold;
  margin:12px 0 6px;
}

input{
  width:100%;
  padding:13px;
  border:2px solid #ddd;
  border-radius:12px;
  outline:none;
}

input:focus{border-color:#4caf50}

.diff{
  display:flex;
  gap:7px;
}

.diff button{
  flex:1;
  padding:11px 4px;
  border:2px solid #ddd;
  background:white;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.diff button.active{
  background:#4caf50;
  border-color:#4caf50;
  color:white;
}

.main{
  width:100%;
  border:0;
  border-radius:14px;
  background:#4caf50;
  color:white;
  padding:14px;
  margin-top:16px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px #388e3c;
}

.main:active{
  transform:translateY(4px);
  box-shadow:0 1px #388e3c;
}

.back{
  background:#777;
  box-shadow:0 5px #555;
}

/* CHARACTER */

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  max-height:390px;
  overflow-y:auto;
  padding:4px;
}

.animal{
  border:2px solid transparent;
  background:#f3f3f3;
  border-radius:13px;
  padding:8px 2px;
  cursor:pointer;
}

.animal.selected{
  background:#e8f5e9;
  border-color:#4caf50;
}

.animal span:first-child{
  display:block;
  font-size:29px;
}

.animal small{
  color:#444;
  font-size:9px;
}

.selectedText{
  min-height:20px;
  margin-top:10px;
  color:#4caf50;
  font-weight:bold;
}

/* MUSIC */

.music-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:430px;
  overflow-y:auto;
}

.music-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  border:2px solid #ddd;
  border-radius:14px;
  background:white;
  cursor:pointer;
  text-align:left;
}

.music-item.selected{
  border-color:#4caf50;
  background:#eaf7eb;
}

.music-icon{
  font-size:27px;
}

.music-info{
  flex:1;
}

.music-info b{
  display:block;
  font-size:14px;
}

.music-info small{
  color:#777;
}

.preview{
  border:0;
  border-radius:9px;
  background:#2196f3;
  color:white;
  padding:7px 9px;
  cursor:pointer;
}

/* GAME */

#gameScreen{
  position:relative;
  width:min(500px,100%);
  height:100vh;
  max-height:100vh;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  background:#9be0ff;
  border-radius:12px;
}

.gameUI{
  position:absolute;
  top:13px;
  left:13px;
  right:13px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.score{
  background:rgba(0,0,0,.45);
  color:white;
  padding:8px 13px;
  border-radius:12px;
  font-weight:bold;
}

.musicButton{
  pointer-events:auto;
  border:0;
  width:42px;
  height:42px;
  border-radius:50%;
  background:white;
  cursor:pointer;
  font-size:20px;
}

#gameOver{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
}

.overBox{
  width:86%;
  background:white;
  border-radius:22px;
  padding:25px;
  text-align:center;
}

.overBox h2{
  font-size:31px;
}

.overAnimal{
  font-size:65px;
  margin:8px;
}

.overScore{
  font-size:21px;
  margin:7px;
}

.best{
  color:#ff9800;
  font-weight:bold;
}

.blue{
  background:#2196f3;
  box-shadow:0 5px #1976d2;
}

.gray{
  background:#777;
  box-shadow:0 5px #555;
}

@media(max-width:390px){
  .screen{padding:18px}
  h1{font-size:34px}
  .grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<div id="app">

<!-- MENU -->
<div id="menu" class="screen">

  <h1>🐾 Animal Jump</h1>
  <div class="sub">Nhảy qua cột và lập kỷ lục!</div>

  <label>Tên người chơi</label>
  <input id="name" maxlength="15" placeholder="Nhập tên của bạn">

  <label>Độ khó</label>

  <div class="diff">
    <button class="active" data-diff="easy">🟢 Dễ</button>
    <button data-diff="normal">🟡 Thường</button>
    <button data-diff="hard">🔴 Khó</button>
  </div>

  <button id="toAnimal" class="main">
    🐾 CHỌN NHÂN VẬT
  </button>

</div>


<!-- NHÂN VẬT -->
<div id="animalScreen" class="screen hidden">

  <h2>🐾 Chọn nhân vật</h2>
  <div class="sub">Chọn con vật bạn muốn điều khiển</div>

  <div id="animals" class="grid"></div>

  <div id="selectedAnimalText" class="selectedText">
    Đã chọn: 🐤 Vịt
  </div>

  <button id="toMusic" class="main">
    🎵 CHỌN NHẠC
  </button>

  <button id="backMenu1" class="main back">
    ← QUAY LẠI
  </button>

</div>


<!-- NHẠC -->
<div id="musicScreen" class="screen hidden">

  <h2>🎵 Chọn nhạc</h2>
  <div class="sub">Chọn nhạc hoặc chơi không nhạc</div>

  <div id="musicList" class="music-list"></div>

  <button id="playGame" class="main">
    🚀 CHƠI NGAY
  </button>

  <button id="backAnimal" class="main back">
    ← ĐỔI NHÂN VẬT
  </button>

</div>


<!-- GAME -->
<div id="gameScreen" class="hidden">

  <canvas id="canvas" width="400" height="700"></canvas>

  <div class="gameUI">
    <div class="score">
      ⭐ <span id="score">0</span>
    </div>

    <button id="musicButton" class="musicButton">🔊</button>
  </div>

  <div id="gameOver" class="hidden">

    <div class="overBox">

      <h2>💥 Game Over!</h2>

      <div id="overAnimal" class="overAnimal">🐤</div>

      <div id="overName"></div>

      <div class="overScore">
        Điểm: <b id="finalScore">0</b>
      </div>

      <div class="best">
        🏆 Kỷ lục: <span id="bestScore">0</span>
      </div>

      <button id="retry" class="main">
        🔄 CHƠI LẠI
      </button>

      <button id="changeAnimal" class="main blue">
        🐾 ĐỔI NHÂN VẬT
      </button>

      <button id="home" class="main gray">
        🏠 MENU
      </button>

    </div>

  </div>

</div>

</div>


<script>

/* ============================
   NHÂN VẬT
============================ */

const animals = [
["duck","🐤","Vịt"],
["cat","🐱","Mèo"],
["dog","🐶","Chó"],
["rabbit","🐰","Thỏ"],
["frog","🐸","Ếch"],
["panda","🐼","Gấu trúc"],
["fox","🦊","Cáo"],
["bee","🐝","Ong"],
["penguin","🐧","Chim cánh cụt"],
["bear","🐻","Gấu"],
["koala","🐨","Koala"],
["tiger","🐯","Hổ"],
["lion","🦁","Sư tử"],
["cow","🐮","Bò"],
["pig","🐷","Heo"],
["mouse","🐭","Chuột"],
["hamster","🐹","Hamster"],
["monkey","🐵","Khỉ"],
["chicken","🐔","Gà"],
["chick","🐥","Gà con"],
["bird","🐦","Chim"],
["owl","🦉","Cú"],
["parrot","🦜","Vẹt"],
["swan","🦢","Thiên nga"],
["eagle","🦅","Đại bàng"],
["turkey","🦃","Gà tây"],
["horse","🐴","Ngựa"],
["unicorn","🦄","Kỳ lân"],
["llama","🦙","Alpaca"],
["camel","🐫","Lạc đà"],
["elephant","🐘","Voi"],
["giraffe","🦒","Hươu cao cổ"],
["zebra","🦓","Ngựa vằn"],
["deer","🦌","Hươu"],
["boar","🐗","Heo rừng"],
["goat","🐐","Dê"],
["sheep","🐑","Cừu"],
["wolf","🐺","Sói"],
["dragon","🐲","Rồng"],
["dinosaur","🦖","Khủng long"]
];

let selectedAnimal=animals[0];


/* ============================
   NHẠC
============================ */

const musicTracks=[
  {
    name:"🔥 Phonk Music",
    file:"music/phonk.mp3"
  },
  {
    name:"⚡ Phonk Aura",
    file:"music/phonk-aura.mp3"
  },
  {
    name:"🏎️ Race Cars",
    file:"music/race-cars.mp3"
  },
  {
    name:"🎮 Hard EDM Phonk",
    file:"music/hard-edm.mp3"
  },
  {
    name:"🌙 Phonks",
    file:"music/phonks.mp3"
  },
  {
    name:"🏁 IRAY - PHONK",
    file:"music/iray.mp3"
  },
  {
    name:"💿 Phonk 2025",
    file:"music/phonk-2025.mp3"
  },
  {
    name:"🎧 Phonk Beat",
    file:"music/phonk-beat.mp3"
  },
  {
    name:"🔇 Không chọn nhạc",
    file:null
  }
];

let selectedMusic=musicTracks[8];
let previewAudio=null;


/* ============================
   TẠO NHÂN VẬT
============================ */

const animalBox=document.getElementById("animals");

animals.forEach((a,i)=>{

  const el=document.createElement("button");

  el.className="animal";

  if(i===0) el.classList.add("selected");

  el.innerHTML=`
    <span>${a[1]}</span>
    <small>${a[2]}</small>
  `;

  el.onclick=()=>{

    document.querySelectorAll(".animal")
      .forEach(x=>x.classList.remove("selected"));

    el.classList.add("selected");

    selectedAnimal=a;

    document.getElementById(
      "selectedAnimalText"
    ).textContent=
      "Đã chọn: "+a[1]+" "+a[2];

  };

  animalBox.appendChild(el);

});


/* ============================
   TẠO DANH SÁCH NHẠC
============================ */

const musicBox=
  document.getElementById("musicList");

musicTracks.forEach((track,i)=>{

  const item=document.createElement("div");

  item.className="music-item";

  if(i===8) item.classList.add("selected");

  item.innerHTML=`

    <div class="music-icon">
      ${track.file ? "🎵" : "🔇"}
    </div>

    <div class="music-info">
      <b>${track.name}</b>
      <small>
        ${track.file ? "Nhấn ▶ để nghe thử" : "Chơi không có nhạc"}
      </small>
    </div>

    ${
      track.file
      ?
      `<button class="preview">▶</button>`
      :
      ""
    }

  `;

  item.onclick=(e)=>{

    if(e.target.classList.contains("preview")) return;

    document.querySelectorAll(".music-item")
      .forEach(x=>x.classList.remove("selected"));

    item.classList.add("selected");

    selectedMusic=track;

    stopPreview();

  };

  const preview=item.querySelector(".preview");

  if(preview){

    preview.onclick=(e)=>{

      e.stopPropagation();

      if(previewAudio &&
         !previewAudio.paused){

        stopPreview();

        preview.textContent="▶";

        return;
      }

      stopPreview();

      previewAudio=
        new Audio(track.file);

      previewAudio.volume=.5;

      previewAudio.play()
      .then(()=>{
        preview.textContent="⏸";
      })
      .catch(()=>{
        alert(
          "Chưa có file nhạc này trong thư mục music."
        );
      });

      previewAudio.onended=()=>{
        preview.textContent="▶";
      };

    };

  }

});


function stopPreview(){

  if(previewAudio){

    previewAudio.pause();
    previewAudio.currentTime=0;
    previewAudio=null;

  }

  document.querySelectorAll(".preview")
    .forEach(x=>x.textContent="▶");

}


/* ============================
   CHUYỂN MÀN HÌNH
============================ */

const menu=
  document.getElementById("menu");

const animalScreen=
  document.getElementById("animalScreen");

const musicScreen=
  document.getElementById("musicScreen");

const gameScreen=
  document.getElementById("gameScreen");


document.querySelectorAll(".diff button")
.forEach(btn=>{

  btn.onclick=()=>{

    document.querySelectorAll(".diff button")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    selectedDifficulty=
      btn.dataset.diff;

  };

});

let selectedDifficulty="easy";


document.getElementById("toAnimal").onclick=()=>{

  menu.classList.add("hidden");
  animalScreen.classList.remove("hidden");

};


document.getElementById("backMenu1").onclick=()=>{

  animalScreen.classList.add("hidden");
  menu.classList.remove("hidden");

};


document.getElementById("toMusic").onclick=()=>{

  animalScreen.classList.add("hidden");
  musicScreen.classList.remove("hidden");

};


document.getElementById("backAnimal").onclick=()=>{

  musicScreen.classList.add("hidden");
  animalScreen.classList.remove("hidden");

};


document.getElementById("playGame").onclick=()=>{

  musicScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  startGame();

};


/* ============================
   GAME
============================ */

const canvas=
  document.getElementById("canvas");

const ctx=canvas.getContext("2d");

let player;
let pipes=[];
let score=0;
let running=false;
let lastPipe=0;
let animation;
let gameAudio=null;


const settings={

  easy:{
    speed:3.5,
    gap:155,
    spawn:1900
  },

  normal:{
    speed:4.4,
    gap:135,
    spawn:1650
  },

  hard:{
    speed:5.3,
    gap:115,
    spawn:1450
  }

};


/* ============================
   BẮT ĐẦU
============================ */

function startGame(){

  stopGameAudio();

  score=0;
  pipes=[];
  lastPipe=0;
  running=true;

  document.getElementById("score")
    .textContent="0";

  document.getElementById("gameOver")
    .classList.add("hidden");

  player={
    x:85,
    y:canvas.height/2,
    velocity:0,
    gravity:.42,
    jump:-7.5,
    size:42
  };

  startSelectedMusic();

  cancelAnimationFrame(animation);

  animation=
    requestAnimationFrame(gameLoop);

}


/* ============================
   NHẠC GAME
============================ */

function startSelectedMusic(){

  if(!selectedMusic.file) return;

  gameAudio=
    new Audio(selectedMusic.file);

  gameAudio.loop=true;
  gameAudio.volume=.35;

  gameAudio.play().catch(()=>{

    console.log(
      "Trình duyệt cần thao tác của người dùng để phát nhạc."
    );

  });

}


function stopGameAudio(){

  if(gameAudio){

    gameAudio.pause();
    gameAudio.currentTime=0;
    gameAudio=null;

  }

}


/* ============================
   NHẢY
============================ */

function jump(){

  if(!running) return;

  player.velocity=
    player.jump;

}


document.addEventListener("keydown",e=>{

  if(e.code==="Space"){

    e.preventDefault();
    jump();

  }

});


canvas.addEventListener("mousedown",jump);

canvas.addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    jump();
  },
  {passive:false}
);


/* ============================
   TẠO CỘT
============================ */

function createPipe(){

  const s=settings[selectedDifficulty];

  const minTop=80;

  const maxTop=
    canvas.height-
    s.gap-
    130;

  const top=
    Math.random()*
    (maxTop-minTop)+
    minTop;

  pipes.push({

    x:canvas.width,
    width:62,
    top:top,
    gap:s.gap,
    passed:false

  });

}


/* ============================
   LOOP
============================ */

function gameLoop(time){

  if(!running)return;

  update(time);

  draw();

  animation=
    requestAnimationFrame(gameLoop);

}


/* ============================
   UPDATE
============================ */

function update(time){

  const s=settings[selectedDifficulty];

  player.velocity+=player.gravity;
  player.y+=player.velocity;

  if(
    !lastPipe ||
    time-lastPipe>s.spawn
  ){

    createPipe();
    lastPipe=time;

  }

  pipes.forEach(p=>{
    p.x-=s.speed;
  });

  pipes=pipes.filter(
    p=>p.x+p.width>-20
  );

  pipes.forEach(p=>{

    if(
      !p.passed &&
      p.x+p.width<player.x
    ){

      p.passed=true;
      score++;

      document.getElementById("score")
        .textContent=score;

    }

  });


  if(
    player.y-player.size/2<=0 ||
    player.y+player.size/2>=
      canvas.height-55
  ){

    endGame();
    return;

  }


  for(const p of pipes){

    const left=
      player.x-player.size/2;

    const right=
      player.x+player.size/2;

    const top=
      player.y-player.size/2;

    const bottom=
      player.y+player.size/2;

    const hitX=
      right>p.x &&
      left<p.x+p.width;

    const hitTop=
      top<p.top;

    const hitBottom=
      bottom>p.top+p.gap;

    if(
      hitX &&
      (hitTop||hitBottom)
    ){

      endGame();
      return;

    }

  }

}


/* ============================
   VẼ
============================ */

function draw(){

  ctx.clearRect(
    0,0,
    canvas.width,
    canvas.height
  );


  /* SKY */

  const sky=
    ctx.createLinearGradient(
      0,0,
      0,canvas.height
    );

  sky.addColorStop(0,"#82d8ff");
  sky.addColorStop(1,"#e7faff");

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,
    canvas.width,
    canvas.height
  );


  /* MÂY */

  cloud(65,90,1);
  cloud(270,145,.8);
  cloud(165,250,.6);


  /* CỘT */

  pipes.forEach(drawPipe);


  /* ĐẤT */

  ctx.fillStyle="#78c850";

  ctx.fillRect(
    0,
    canvas.height-55,
    canvas.width,
    55
  );

  ctx.fillStyle="#5ca53c";

  ctx.fillRect(
    0,
    canvas.height-55,
    canvas.width,
    8
  );


  /* NHÂN VẬT */

  ctx.save();

  ctx.font=
    player.size+"px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.shadowColor=
    "rgba(0,0,0,.2)";

  ctx.shadowBlur=5;

  ctx.fillText(
    selectedAnimal[1],
    player.x,
    player.y
  );

  ctx.restore();

}


function cloud(x,y,s){

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  ctx.fillStyle=
    "rgba(255,255,255,.8)";

  ctx.beginPath();

  ctx.arc(0,10,22,0,Math.PI*2);
  ctx.arc(25,5,28,0,Math.PI*2);
  ctx.arc(55,12,20,0,Math.PI*2);

  ctx.fill();

  ctx.restore();

}


/* ============================
   CỘT
============================ */

function drawPipe(p){

  const bottom=
    p.top+p.gap;

  const gradient=
    ctx.createLinearGradient(
      p.x,0,
      p.x+p.width,0
    );

  gradient.addColorStop(
    0,"#2e8736"
  );

  gradient.addColorStop(
    .5,"#65c95d"
  );

  gradient.addColorStop(
    1,"#236d2b"
  );


  /* CỘT TRÊN */

  ctx.fillStyle=gradient;

  ctx.fillRect(
    p.x,
    0,
    p.width,
    p.top
  );

  ctx.strokeStyle="#195c20";
  ctx.lineWidth=3;

  ctx.strokeRect(
    p.x,
    0,
    p.width,
    p.top
  );


  /* ĐẦU CỘT TRÊN */

  ctx.fillStyle="#55b94d";

  ctx.fillRect(
    p.x-7,
    p.top-22,
    p.width+14,
    22
  );

  ctx.strokeRect(
    p.x-7,
    p.top-22,
    p.width+14,
    22
  );


  /* CỘT DƯỚI */

  ctx.fillStyle=gradient;

  ctx.fillRect(
    p.x,
    bottom,
    p.width,
    canvas.height-bottom
  );

  ctx.strokeRect(
    p.x,
    bottom,
    p.width,
    canvas.height-bottom
  );


  /* ĐẦU CỘT DƯỚI */

  ctx.fillStyle="#55b94d";

  ctx.fillRect(
    p.x-7,
    bottom,
    p.width+14,
    22
  );

  ctx.strokeRect(
    p.x-7,
    bottom,
    p.width+14,
    22
  );


  /* ÁNH SÁNG */

  ctx.fillStyle=
    "rgba(255,255,255,.17)";

  ctx.fillRect(
    p.x+9,
    0,
    7,
    p.top
  );

  ctx.fillRect(
    p.x+9,
    bottom,
    7,
    canvas.height-bottom
  );

}


/* ============================
   GAME OVER
============================ */

function endGame(){

  if(!running)return;

  running=false;

  cancelAnimationFrame(animation);

  stopGameAudio();

  let best=
    Number(
      localStorage.getItem("animalJumpBest")
    )||0;

  if(score>best){

    best=score;

    localStorage.setItem(
      "animalJumpBest",
      best
    );

  }


  document.getElementById("finalScore")
    .textContent=score;

  document.getElementById("bestScore")
    .textContent=best;

  document.getElementById("overAnimal")
    .textContent=selectedAnimal[1];

  const name=
    document.getElementById("name")
      .value.trim()||"Người chơi";

  document.getElementById("overName")
    .innerHTML=
      `<b>${name}</b> đã chơi với ${selectedAnimal[2]}`;

  document.getElementById("gameOver")
    .classList.remove("hidden");

}


/* ============================
   NÚT GAME OVER
============================ */

document.getElementById("retry").onclick=()=>{
  startGame();
};


document.getElementById("changeAnimal").onclick=()=>{

  stopGameAudio();

  running=false;

  gameScreen.classList.add("hidden");
  document.getElementById("gameOver")
    .classList.add("hidden");

  animalScreen.classList.remove("hidden");

};


document.getElementById("home").onclick=()=>{

  stopGameAudio();

  running=false;

  gameScreen.classList.add("hidden");

  document.getElementById("gameOver")
    .classList.add("hidden");

  menu.classList.remove("hidden");

};


/* ============================
   NÚT ÂM LƯỢNG
============================ */

let musicMuted=false;

document.getElementById("musicButton").onclick=()=>{

  musicMuted=!musicMuted;

  document.getElementById("musicButton")
    .textContent=
      musicMuted ? "🔇" : "🔊";

  if(gameAudio){

    gameAudio.muted=musicMuted;

  }

};

</script>
