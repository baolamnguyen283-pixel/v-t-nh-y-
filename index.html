 <!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Animal Jump 🐾</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#79d7ff,#b8f3ff);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.screen{
  width:100%;
  max-width:900px;
  min-height:100vh;
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.screen.active{
  display:flex;
}

.card{
  width:min(700px,95vw);
  background:rgba(255,255,255,.94);
  border-radius:25px;
  padding:30px;
  text-align:center;
  box-shadow:0 15px 45px rgba(0,0,0,.2);
}

h1{
  font-size:42px;
  margin-bottom:15px;
  color:#1684b8;
}

h2{
  margin-bottom:18px;
  color:#1684b8;
}

input{
  width:100%;
  max-width:450px;
  padding:14px;
  border:2px solid #9edff5;
  border-radius:14px;
  font-size:18px;
  margin:10px 0 18px;
  outline:none;
}

button{
  border:0;
  border-radius:14px;
  padding:13px 22px;
  margin:6px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  background:#20a9df;
  color:white;
  transition:.15s;
}

button:hover{
  transform:scale(1.05);
}

button:active{
  transform:scale(.96);
}

.difficulty{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.diff{
  background:#ddd;
  color:#333;
}

.diff.selected{
  background:#20a9df;
  color:white;
}

.animal-grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:7px;
  max-height:430px;
  overflow-y:auto;
  padding:8px;
}

.animal{
  height:55px;
  font-size:31px;
  padding:4px;
  background:#eefaff;
  border:2px solid transparent;
  border-radius:12px;
  cursor:pointer;
}

.animal.selected{
  border-color:#1684b8;
  background:#bdeeff;
  transform:scale(1.08);
}

#gameScreen{
  padding:0;
  position:relative;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:900px;
  overflow:hidden;
  background:linear-gradient(#76d8ff 0%,#d5f7ff 75%,#71d35c 75%);
}

#score{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  font-size:28px;
  font-weight:bold;
  color:white;
  text-shadow:2px 2px 4px #555;
}

#player{
  position:absolute;
  width:55px;
  height:55px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:43px;
  z-index:10;
  transition:transform .05s;
}

.pipe{
  position:absolute;
  width:65px;
  background:linear-gradient(90deg,#189447,#36cf65,#13793a);
  border:3px solid #0d692e;
  z-index:5;
}

.pipe.top{
  top:0;
  border-radius:0 0 10px 10px;
}

.pipe.bottom{
  bottom:25%;
  border-radius:10px 10px 0 0;
}

.pipe::after{
  content:"";
  position:absolute;
  left:-8px;
  width:78px;
  height:24px;
  background:linear-gradient(90deg,#16823d,#48dc70,#126b34);
  border:3px solid #0d692e;
  border-radius:6px;
}

.pipe.top::after{
  bottom:-3px;
}

.pipe.bottom::after{
  top:-3px;
}

.ground{
  position:absolute;
  bottom:0;
  height:25%;
  width:100%;
  background:
    repeating-linear-gradient(
      45deg,
      #65c94d 0,
      #65c94d 18px,
      #56b942 18px,
      #56b942 36px
    );
  border-top:5px solid #3b9c35;
  z-index:8;
}

#gameOver{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:50;
}

.over-card{
  background:white;
  padding:30px;
  width:min(400px,90vw);
  border-radius:25px;
  text-align:center;
}

.over-card h2{
  color:#e34a4a;
  font-size:32px;
}

#finalScore{
  font-size:24px;
  margin:10px;
}

.small{
  color:#666;
  margin-top:10px;
}

@media(max-width:650px){
  h1{font-size:34px}

  .card{
    padding:20px;
  }

  .animal-grid{
    grid-template-columns:repeat(6,1fr);
    max-height:390px;
  }

  .animal{
    height:53px;
  }

  #player{
    width:48px;
    height:48px;
    font-size:38px;
  }

  .pipe{
    width:55px;
  }

  .pipe::after{
    width:68px;
  }
}
</style>
</head>

<body>

<!-- MENU -->
<section id="menuScreen" class="screen active">
  <div class="card">
    <h1>🐾 Animal Jump</h1>

    <p>Nhập tên người chơi</p>

    <input id="playerName"
           maxlength="20"
           placeholder="Tên của bạn...">

    <h3>Chọn độ khó</h3>

    <div class="difficulty">
      <button class="diff selected" data-level="easy">🟢 Dễ</button>
      <button class="diff" data-level="normal">🟡 Thường</button>
      <button class="diff" data-level="hard">🔴 Khó</button>
    </div>

    <button id="chooseAnimalBtn">
      🐾 Chọn con vật
    </button>
  </div>
</section>

<!-- ANIMAL -->
<section id="animalScreen" class="screen">
  <div class="card">
    <h2>🐾 Chọn con vật</h2>

    <div id="animalGrid" class="animal-grid"></div>

    <br>

    <button id="backBtn">⬅ Quay lại</button>
    <button id="startBtn">🚀 Bắt đầu</button>
  </div>
</section>

<!-- GAME -->
<section id="gameScreen" class="screen">

  <div id="game">

    <div id="score">0</div>

    <div id="player">🐤</div>

    <div class="ground"></div>

    <div id="gameOver">
      <div class="over-card">
        <h2>💥 Game Over!</h2>

        <div id="finalScore">
          Điểm: 0
        </div>

        <div id="bestScore">
          Kỷ lục: 0
        </div>

        <button id="retryBtn">
          🔄 Chơi lại
        </button>

        <button id="menuBtn">
          🏠 Menu
        </button>
      </div>
    </div>

  </div>

</section>

<script>

/* =========================
   100 CON VẬT
========================= */

const animals = [
"🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯",
"🦁","🐮","🐷","🐸","🐵","🙈","🙉","🙊","🐔","🐧",
"🐦","🐤","🦆","🦅","🦉","🦇","🐺","🐗","🐴","🦄",
"🐝","🐛","🦋","🐌","🐞","🐜","🕷️","🐢","🐍","🦎",
"🦖","🦕","🐙","🦑","🦀","🐠","🐟","🐡","🦈","🐳",
"🐋","🐬","🦭","🐊","🦓","🦒","🐘","🦏","🦛","🐪",
"🐫","🦙","🦘","🦬","🐃","🐂","🐄","🐎","🐖","🐏",
"🐑","🐐","🦌","🫎","🐕","🐩","🦮","🐕‍🦺","🐈","🐈‍⬛",
"🐓","🦃","🦚","🦜","🦢","🦩","🕊️","🐇","🦔","🦝",
"🦡","🦨","🦦","🦥","🐿️","🦫","🐉","🐲","👾","🌟"
];

/* =========================
   ELEMENTS
========================= */

const menuScreen =
  document.getElementById("menuScreen");

const animalScreen =
  document.getElementById("animalScreen");

const gameScreen =
  document.getElementById("gameScreen");

const animalGrid =
  document.getElementById("animalGrid");

const player =
  document.getElementById("player");

const game =
  document.getElementById("game");

const scoreText =
  document.getElementById("score");

const gameOver =
  document.getElementById("gameOver");

const finalScore =
  document.getElementById("finalScore");

const bestScore =
  document.getElementById("bestScore");

const playerName =
  document.getElementById("playerName");

/* =========================
   SETTINGS
========================= */

const settings = {

  easy:{
    speed:3.5,
    gap:110,
    spawn:1900
  },

  normal:{
    speed:4.5,
    gap:100,
    spawn:1650
  },

  hard:{
    speed:5.5,
    gap:90,
    spawn:1450
  }

};

let difficulty = "easy";

let selectedAnimal = "🐤";

let running = false;

let score = 0;

let best = Number(
  localStorage.getItem("animalJumpBest") || 0
);

let playerY = 300;

let velocity = 0;

let pipes = [];

let lastTime = 0;

let spawnTimer = 0;

let animation;

/* =========================
   TẠO 100 CON VẬT
========================= */

animals.forEach((animal,index)=>{

  const button =
    document.createElement("button");

  button.className = "animal";

  button.textContent = animal;

  if(animal === selectedAnimal){
    button.classList.add("selected");
  }

  button.title =
    "Con vật số " + (index+1);

  button.onclick = ()=>{

    document
      .querySelectorAll(".animal")
      .forEach(x=>x.classList.remove("selected"));

    button.classList.add("selected");

    selectedAnimal = animal;

  };

  animalGrid.appendChild(button);

});

/* =========================
   ĐỘ KHÓ
========================= */

document
.querySelectorAll(".diff")
.forEach(button=>{

  button.onclick = ()=>{

    document
      .querySelectorAll(".diff")
      .forEach(x=>x.classList.remove("selected"));

    button.classList.add("selected");

    difficulty =
      button.dataset.level;

  };

});

/* =========================
   MÀN HÌNH
========================= */

document.getElementById(
  "chooseAnimalBtn"
).onclick = ()=>{

  animalScreen.classList.add("active");
  menuScreen.classList.remove("active");

};

document.getElementById(
  "backBtn"
).onclick = ()=>{

  animalScreen.classList.remove("active");
  menuScreen.classList.add("active");

};

document.getElementById(
  "startBtn"
).onclick = startGame;

/* =========================
   NHẠC NỀN
========================= */

let music = null;

function startMusic(){

  if(music){
    music.pause();
    music.currentTime = 0;
  }

  /*
    Nhạc nền nhẹ tạo bằng Web Audio.
    Không cần file MP3.
  */

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext) return;

    const ctx = new AudioContext();

    const notes = [
      261.63,
      329.63,
      392,
      329.63,
      293.66,
      349.23,
      440,
      349.23
    ];

    let index = 0;

    function playNote(){

      if(!running){
        return;
      }

      const osc =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      osc.type = "triangle";

      osc.frequency.value =
        notes[index % notes.length];

      gain.gain.setValueAtTime(
        0.025,
        ctx.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + .35
      );

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();

      osc.stop(
        ctx.currentTime + .35
      );

      index++;

      setTimeout(playNote,420);

    }

    playNote();

  }catch(e){}

}

/* =========================
   START GAME
========================= */

function startGame(){

  const name =
    playerName.value.trim();

  if(!name){

    playerName.focus();

    alert("Nhập tên người chơi trước nhé!");

    return;

  }

  animalScreen.classList.remove("active");
  gameScreen.classList.add("active");

  score = 0;

  scoreText.textContent = "0";

  playerY = game.clientHeight * .4;

  velocity = 0;

  pipes.forEach(pipe=>{

    pipe.top.remove();
    pipe.bottom.remove();

  });

  pipes = [];

  spawnTimer = 0;

  player.textContent =
    selectedAnimal;

  player.style.left =
    Math.min(
      game.clientWidth * .25,
      180
    ) + "px";

  player.style.top =
    playerY + "px";

  gameOver.style.display =
    "none";

  running = true;

  startMusic();

  cancelAnimationFrame(animation);

  lastTime =
    performance.now();

  animation =
    requestAnimationFrame(loop);

}

/* =========================
   NHẢY
========================= */

function jump(){

  if(!running) return;

  velocity = -8.5;

}

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.code === "Space" ||
      e.code === "ArrowUp"
    ){

      e.preventDefault();

      jump();

    }

  }
);

game.addEventListener(
  "pointerdown",
  ()=>{

    if(running){
      jump();
    }

  }
);

/* =========================
   TẠO ỐNG
========================= */

function createPipe(){

  const setting =
    settings[difficulty];

  const gameHeight =
    game.clientHeight;

  const groundHeight =
    gameHeight * .25;

  const maxTop =
    gameHeight -
    groundHeight -
    setting.gap -
    100;

  const minTop = 70;

  const topHeight =
    Math.random() *
    (maxTop-minTop) +
    minTop;

  const bottomHeight =
    gameHeight -
    groundHeight -
    topHeight -
    setting.gap;

  const top =
    document.createElement("div");

  top.className =
    "pipe top";

  top.style.height =
    topHeight + "px";

  top.style.left =
    game.clientWidth + "px";

  const bottom =
    document.createElement("div");

  bottom.className =
    "pipe bottom";

  bottom.style.height =
    bottomHeight + "px";

  bottom.style.left =
    game.clientWidth + "px";

  game.appendChild(top);
  game.appendChild(bottom);

  pipes.push({

    top,
    bottom,

    x:game.clientWidth,

    topHeight,

    bottomHeight,

    passed:false

  });

}

/* =========================
   COLLISION
========================= */

function collision(){

  const px =
    parseFloat(player.style.left);

  const py =
    playerY;

  const pw =
    player.offsetWidth;

  const ph =
    player.offsetHeight;

  const ground =
    game.clientHeight * .75;

  if(
    py < 0 ||
    py + ph > ground
  ){

    return true;

  }

  for(const pipe of pipes){

    const pipeWidth = 65;

    const hitX =
      px + pw > pipe.x &&
      px < pipe.x + pipeWidth;

    if(!hitX) continue;

    const hitTop =
      py < pipe.topHeight;

    const gapBottom =
      pipe.topHeight +
      settings[difficulty].gap;

    const hitBottom =
      py + ph > gapBottom;

    if(hitTop || hitBottom){

      return true;

    }

  }

  return false;

}

/* =========================
   GAME LOOP
========================= */

function loop(time){

  if(!running) return;

  const delta =
    Math.min(
      (time-lastTime)/16.67,
      2
    );

  lastTime = time;

  const setting =
    settings[difficulty];

  velocity +=
    0.42 * delta;

  playerY +=
    velocity * delta;

  player.style.top =
    playerY + "px";

  spawnTimer +=
    delta * 16.67;

  if(spawnTimer >= setting.spawn){

    spawnTimer = 0;

    createPipe();

  }

  for(let i=pipes.length-1;i>=0;i--){

    const pipe = pipes[i];

    pipe.x -=
      setting.speed * delta;

    pipe.top.style.left =
      pipe.x + "px";

    pipe.bottom.style.left =
      pipe.x + "px";

    if(
      !pipe.passed &&
      pipe.x + 65 <
      parseFloat(player.style.left)
    ){

      pipe.passed = true;

      score++;

      scoreText.textContent =
        score;

    }

    if(pipe.x < -100){

      pipe.top.remove();
      pipe.bottom.remove();

      pipes.splice(i,1);

    }

  }

  if(collision()){

    endGame();

    return;

  }

  animation =
    requestAnimationFrame(loop);

}

/* =========================
   GAME OVER
========================= */

function endGame(){

  running = false;

  cancelAnimationFrame(animation);

  if(score > best){

    best = score;

    localStorage.setItem(
      "animalJumpBest",
      best
    );

  }

  finalScore.textContent =
    "🏆 Điểm: " + score;

  bestScore.textContent =
    "⭐ Kỷ lục: " + best;

  gameOver.style.display =
    "flex";

}

/* =========================
   NÚT CHƠI LẠI
========================= */

document.getElementById(
  "retryBtn"
).onclick = ()=>{

  startGame();

};

/* =========================
   VỀ MENU
========================= */

document.getElementById(
  "menuBtn"
).onclick = ()=>{

  running = false;

  cancelAnimationFrame(animation);

  pipes.forEach(pipe=>{

    pipe.top.remove();
    pipe.bottom.remove();

  });

  pipes = [];

  gameOver.style.display =
    "none";

  gameScreen.classList.remove("active");

  menuScreen.classList.add("active");

};

</script>

</body>
</html>
