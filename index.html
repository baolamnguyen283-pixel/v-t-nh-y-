 <!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Animal Jump</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#222;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* MENU */

#menu{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    background:linear-gradient(
        rgba(40,150,200,.82),
        rgba(70,170,90,.82)
    );
}

h1{
    margin:0 0 8px;
    font-size:64px;
    text-shadow:4px 4px #31515c;
}

h2{
    margin:12px 0 8px;
}

.choice-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
}

.choice{
    width:115px;
    min-height:72px;
    border:3px solid white;
    border-radius:16px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.choice.selected{
    background:#ffd447;
    color:#333;
    border-color:white;
}

.icon{
    display:block;
    font-size:32px;
}

#start{
    margin-top:25px;
    padding:15px 45px;
    border:0;
    border-radius:16px;
    background:#ffbd2e;
    color:#3b2b08;
    font-size:23px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px #a96f08;
}

#start:active{
    transform:translateY(4px);
    box-shadow:0 1px #a96f08;
}

/* SCORE */

#score{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    color:white;
    font-size:38px;
    font-weight:bold;
    text-shadow:3px 3px #333;
}

#best{
    position:fixed;
    top:60px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    color:white;
    font-weight:bold;
    text-shadow:2px 2px #333;
}

/* GAME OVER */

#over{
    position:fixed;
    inset:0;
    z-index:20;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
    background:rgba(0,0,0,.55);
}

#over h2{
    font-size:60px;
    margin:0 0 10px;
    text-shadow:4px 4px #333;
}

#again{
    margin-top:15px;
    padding:14px 38px;
    border:0;
    border-radius:15px;
    background:#ffd447;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:600px){
    h1{font-size:44px}
    .choice{width:95px}
}
</style>
</head>

<body>

<!-- MENU -->

<div id="menu">

    <h1>ANIMAL JUMP</h1>

    <div>Chọn con vật</div>

    <div class="choice-row">

        <button class="choice animal selected" data-animal="duck">
            <span class="icon">🦆</span>
            Vịt
        </button>

        <button class="choice animal" data-animal="cat">
            <span class="icon">🐱</span>
            Mèo
        </button>

        <button class="choice animal" data-animal="rabbit">
            <span class="icon">🐰</span>
            Thỏ
        </button>

        <button class="choice animal" data-animal="frog">
            <span class="icon">🐸</span>
            Ếch
        </button>

    </div>

    <h2>Chọn độ khó</h2>

    <div class="choice-row">

        <button class="choice mode selected" data-mode="easy">
            🟢 DỄ
        </button>

        <button class="choice mode" data-mode="normal">
            🟡 VỪA
        </button>

        <button class="choice mode" data-mode="hard">
            🔴 KHÓ
        </button>

    </div>

    <button id="start">
        ▶ BẮT ĐẦU CHƠI
    </button>

</div>


<div id="score">0</div>
<div id="best">Kỷ lục: 0</div>


<!-- GAME OVER -->

<div id="over">

    <h2>GAME OVER</h2>

    <div id="result"></div>

    <button id="again">
        🔄 VỀ MENU
    </button>

</div>


<canvas id="game"></canvas>


<script>

/* ==============================
   CANVAS
============================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}

resize();

addEventListener("resize",resize);


/* ==============================
   MENU
============================== */

const menu = document.getElementById("menu");
const over = document.getElementById("over");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const result = document.getElementById("result");

let animal = "duck";
let mode = "easy";

const difficulty = {

    easy:{
        speed:2.7,
        gap:300,
        spawn:2300
    },

    normal:{
        speed:3.8,
        gap:250,
        spawn:2100
    },

    hard:{
        speed:5,
        gap:205,
        spawn:1900
    }

};


/* ==============================
   CHỌN CON VẬT
============================== */

document.querySelectorAll(".animal").forEach(b=>{

    b.onclick=()=>{

        document.querySelectorAll(".animal")
        .forEach(x=>x.classList.remove("selected"));

        b.classList.add("selected");

        animal=b.dataset.animal;
    };

});


/* ==============================
   CHỌN ĐỘ KHÓ
============================== */

document.querySelectorAll(".mode").forEach(b=>{

    b.onclick=()=>{

        document.querySelectorAll(".mode")
        .forEach(x=>x.classList.remove("selected"));

        b.classList.add("selected");

        mode=b.dataset.mode;
    };

});


/* ==============================
   GAME DATA
============================== */

let playing=false;
let dead=false;
let score=0;
let pipes=[];
let lastPipe=0;

let best=
Number(localStorage.getItem("animalJumpBest"))||0;

bestEl.textContent="Kỷ lục: "+best;


/* ==============================
   PLAYER
============================== */

const player={
    x:180,
    y:300,
    w:58,
    h:48,
    vy:0
};

const gravity=.48;
const jumpPower=-9;


/* ==============================
   START
============================== */

document.getElementById("start").onclick=startGame;

function startGame(){

    playing=true;
    dead=false;
    score=0;
    pipes=[];
    lastPipe=performance.now();

    player.x=180;
    player.y=canvas.height/2;
    player.vy=0;

    scoreEl.textContent="0";

    menu.style.display="none";
    over.style.display="none";

    /* Cột đầu tiên xuất hiện sau một lúc,
       không đè ngay lên người chơi */

}


/* ==============================
   NHẢY
============================== */

function jump(){

    if(!playing || dead)return;

    player.vy=jumpPower;
}

addEventListener("keydown",e=>{

    if(e.code==="Space"){
        e.preventDefault();
        jump();
    }

});

canvas.addEventListener("pointerdown",jump);


/* ==============================
   TẠO CỘT
============================== */

function createPipe(){

    const d=difficulty[mode];

    const ground=canvas.height-60;

    /*
      Luôn giữ khoảng trống an toàn:
      - Không sát trần
      - Không sát đất
    */

    const minTop=100;

    const maxTop=
        Math.max(
            minTop,
            ground-d.gap-100
        );

    const top=
        minTop+
        Math.random()*
        (maxTop-minTop);

    pipes.push({

        x:canvas.width+80,

        w:85,

        top:top,

        bottom:top+d.gap,

        passed:false

    });

}


/* ==============================
   UPDATE
============================== */

function update(time){

    if(!playing || dead)return;

    const d=difficulty[mode];


    /* trọng lực */

    player.vy+=gravity;
    player.y+=player.vy;


    /* tạo cột */

    if(time-lastPipe>d.spawn){

        createPipe();

        lastPipe=time;
    }


    /* cột */

    for(const p of pipes){

        p.x-=d.speed;


        /*
          Vùng va chạm nhỏ hơn hình
          để chơi dễ chịu hơn
        */

        const px=player.x+8;
        const py=player.y+7;
        const pw=player.w-16;
        const ph=player.h-12;


        const hitX=
            px+pw>p.x &&
            px<p.x+p.w;

        const hitTop=
            py<p.top;

        const hitBottom=
            py+ph>p.bottom;


        if(hitX && (hitTop||hitBottom)){

            endGame();

        }


        /* điểm */

        if(
            !p.passed &&
            p.x+p.w<player.x
        ){

            p.passed=true;

            score++;

            scoreEl.textContent=score;
        }

    }


    pipes=
        pipes.filter(p=>p.x>-120);


    /* trần */

    if(player.y<0){

        endGame();
    }


    /* đất */

    if(
        player.y+player.h>
        canvas.height-60
    ){

        endGame();
    }

}


/* ==============================
   GAME OVER
============================== */

function endGame(){

    if(dead)return;

    dead=true;
    playing=false;

    if(score>best){

        best=score;

        localStorage.setItem(
            "animalJumpBest",
            best
        );

    }

    bestEl.textContent=
        "Kỷ lục: "+best;

    result.innerHTML=
        "Điểm: <b>"+score+
        "</b><br>Kỷ lục: <b>"+
        best+"</b>";

    over.style.display="flex";
}


/* ==============================
   VỀ MENU
============================== */

document.getElementById("again").onclick=()=>{

    over.style.display="none";
    menu.style.display="flex";

    pipes=[];
    score=0;

    scoreEl.textContent="0";
};


/* ==============================
   NỀN
============================== */

function background(){

    const sky=
        ctx.createLinearGradient(
            0,0,0,canvas.height
        );

    sky.addColorStop(0,"#66c9ec");
    sky.addColorStop(1,"#d9f7ff");

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    /* mặt trời */

    ctx.fillStyle="#ffe276";

    ctx.beginPath();

    ctx.arc(
        canvas.width-100,
        90,
        42,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* mây */

    cloud(130,100,30);
    cloud(canvas.width*.55,150,25);
    cloud(canvas.width*.82,75,28);

}


/* ==============================
   MÂY
============================== */

function cloud(x,y,s){

    ctx.fillStyle=
        "rgba(255,255,255,.8)";

    ctx.beginPath();

    ctx.arc(x,y,s,0,Math.PI*2);

    ctx.arc(
        x+s,
        y-8,
        s*.75,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+s*2,
        y,
        s,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* ==============================
   CỘT
============================== */

function drawPipe(p){

    const x=p.x;
    const w=p.w;


    /* màu */

    ctx.fillStyle="#248d3d";


    /* cột trên */

    ctx.fillRect(
        x,
        0,
        w,
        p.top
    );


    /* cột dưới */

    ctx.fillRect(
        x,
        p.bottom,
        w,
        canvas.height-p.bottom
    );


    /* đầu cột trên */

    ctx.fillStyle="#42b954";

    ctx.fillRect(
        x-8,
        p.top-26,
        w+16,
        26
    );


    /* đầu cột dưới */

    ctx.fillRect(
        x-8,
        p.bottom,
        w+16,
        26
    );


    /* viền */

    ctx.strokeStyle="#145d29";
    ctx.lineWidth=4;

    ctx.strokeRect(
        x,
        0,
        w,
        p.top
    );

    ctx.strokeRect(
        x,
        p.bottom,
        w,
        canvas.height-p.bottom
    );


    ctx.strokeRect(
        x-8,
        p.top-26,
        w+16,
        26
    );

    ctx.strokeRect(
        x-8,
        p.bottom,
        w+16,
        26
    );

}


/* ==============================
   NHÂN VẬT
============================== */

function drawPlayer(){

    const x=player.x;
    const y=player.y;


    if(animal==="duck")
        duck(x,y);

    if(animal==="cat")
        cat(x,y);

    if(animal==="rabbit")
        rabbit(x,y);

    if(animal==="frog")
        frog(x,y);

}


/* ==============================
   MẮT
============================== */

function eye(x,y){

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(x,y,6,0,Math.PI*2);

    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(x+1,y,3,0,Math.PI*2);

    ctx.fill();

}


/* ==============================
   VỊT
============================== */

function duck(x,y){

    ctx.fillStyle="#ffd83d";

    ctx.beginPath();

    ctx.ellipse(
        x+27,y+27,
        27,19,
        0,0,Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#efa91d";

    ctx.beginPath();

    ctx.ellipse(
        x+18,y+30,
        14,9,
        -.3,0,Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#ffe34d";

    ctx.beginPath();

    ctx.arc(
        x+43,y+14,
        19,0,Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#ed8124";

    ctx.beginPath();

    ctx.moveTo(x+58,y+13);
    ctx.lineTo(x+77,y+20);
    ctx.lineTo(x+58,y+27);

    ctx.closePath();
    ctx.fill();

    eye(x+49,y+8);

}


/* ==============================
   MÈO
============================== */

function cat(x,y){

    ctx.fillStyle="#e9a15b";


    /* tai */

    ctx.beginPath();

    ctx.moveTo(x+8,y+17);
    ctx.lineTo(x+13,y-5);
    ctx.lineTo(x+26,y+12);

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(x+36,y+12);
    ctx.lineTo(x+50,y-5);
    ctx.lineTo(x+55,y+18);

    ctx.fill();


    /* đầu */

    ctx.beginPath();

    ctx.arc(
        x+31,y+26,
        25,0,Math.PI*2
    );

    ctx.fill();


    /* thân */

    ctx.beginPath();

    ctx.ellipse(
        x+27,y+47,
        25,14,
        0,0,Math.PI*2
    );

    ctx.fill();


    eye(x+22,y+22);
    eye(x+40,y+22);

}


/* ==============================
   THỎ
============================== */

function rabbit(x,y){

    ctx.fillStyle="#f4f4f4";


    /* tai */

    ctx.beginPath();

    ctx.ellipse(
        x+18,y+2,
        9,28,
        -.15,0,Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.ellipse(
        x+42,y+2,
        9,28,
        .15,0,Math.PI*2
    );

    ctx.fill();


    /* đầu */

    ctx.beginPath();

    ctx.arc(
        x+30,y+29,
        24,0,Math.PI*2
    );

    ctx.fill();


    /* thân */

    ctx.beginPath();

    ctx.ellipse(
        x+27,y+48,
        25,14,
        0,0,Math.PI*2
    );

    ctx.fill();


    eye(x+22,y+24);
    eye(x+38,y+24);


    ctx.fillStyle="#ed91aa";

    ctx.beginPath();

    ctx.arc(
        x+30,y+32,
        4,0,Math.PI*2
    );

    ctx.fill();

}


/* ==============================
   ẾCH
============================== */

function frog(x,y){

    ctx.fillStyle="#55bd43";


    /* đầu */

    ctx.beginPath();

    ctx.ellipse(
        x+30,y+29,
        29,22,
        0,0,Math.PI*2
    );

    ctx.fill();


    /* mắt */

    ctx.beginPath();

    ctx.arc(
        x+13,y+12,
        11,0,Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x+47,y+12,
        11,0,Math.PI*2
    );

    ctx.fill();


    eye(x+13,y+12);
    eye(x+47,y+12);


    /* miệng */

    ctx.strokeStyle="#176c2b";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
        x+30,y+28,
        13,0,Math.PI
    );

    ctx.stroke();

}


/* ==============================
   ĐẤT
============================== */

function ground(){

    const y=
        canvas.height-60;


    ctx.fillStyle="#78c94a";

    ctx.fillRect(
        0,y,
        canvas.width,
        60
    );


    /* cỏ */

    ctx.fillStyle="#9ddd58";

    for(
        let x=0;
        x<canvas.width;
        x+=18
    ){

        ctx.beginPath();

        ctx.moveTo(x,y);

        ctx.lineTo(
            x+6,
            y-8
        );

        ctx.lineTo(
            x+12,
            y
        );

        ctx.fill();

    }


    /* đất */

    ctx.fillStyle="#a97543";

    ctx.fillRect(
        0,
        canvas.height-18,
        canvas.width,
        18
    );

}


/* ==============================
   DRAW
============================== */

function draw(){

    background();

    for(const p of pipes)
        drawPipe(p);

    ground();

    /*
      Luôn vẽ nhân vật trong game,
      kể cả lúc Game Over
    */

    if(playing || dead)
        drawPlayer();

}


/* ==============================
   LOOP
============================== */

function loop(time){

    update(time);

    draw();

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

</script>

</body>
</html>
